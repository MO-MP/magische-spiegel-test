<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Magische Spiegel</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    body {
      background: black;
      color: white;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }

    #spiegel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background-image: url("spiegel.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #spiegel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.30);
      pointer-events: none;
      z-index: 1;
    }

    #scherm {
      position: relative;
      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 28px;
      padding: 60px;
      box-sizing: border-box;

      transition: opacity 0.8s ease;
      cursor: pointer;
    }

    /* BEGIN */

    #titel {
      font-size: clamp(38px, 6vw, 70px);
      font-weight: normal;
      white-space: nowrap;
    }

    #ondertitel {
      font-size: clamp(20px, 3vw, 38px);
      font-weight: normal;
    }

    #aanraken {
      font-size: clamp(25px, 4vw, 48px);
      font-weight: normal;

      animation: zachtGloeien 2.5s ease-in-out infinite;
    }

    /* INTRO */

    #intro {
      font-size: clamp(25px, 4vw, 48px);
      line-height: 1.5;

      max-width: 80vw;
      padding: 0 30px;
      box-sizing: border-box;

      opacity: 0;

      animation: introVerschijnen 2s ease forwards;
    }

    /* ROLAFBEELDING */

    #rol-afbeelding {
      display: block;

      width: auto;
      height: auto;

      max-width: 65vw;
      max-height: 40vh;

      object-fit: contain;

      margin: 0 auto 5px auto;

      opacity: 0;

      animation: afbeeldingverschijnen 1.8s ease forwards;
    }

    /* ROLNAAM */

    #uitkomst {
      font-size: clamp(38px, 6vw, 70px);
      font-weight: normal;

      max-width: 90vw;
      padding: 10px 20px;
      box-sizing: border-box;

      animation: verschijnen 1.8s ease forwards;
    }

    /* BESCHRIJVING */

    #beschrijving {
      font-size: clamp(18px, 2.6vw, 30px);

      max-width: 75vw;

      line-height: 1.35;

      padding: 0 20px;
      box-sizing: border-box;

      opacity: 0;

      animation: beschrijving 1.8s ease 0.4s forwards;
    }

    /* AFSLUITING */

    #afsluiting {
      font-size: clamp(25px, 4vw, 48px);

      line-height: 1.5;

      max-width: 80vw;

      padding: 0 30px;
      box-sizing: border-box;

      opacity: 0;

      animation: afsluitingVerschijnen 2s ease forwards;
    }

    /* GEHEIM */

    #geheim-tekst {
      font-size: clamp(30px, 5vw, 60px);

      opacity: 0;

      animation: geheimTekst 1.5s ease forwards;
    }

    /* GEHEIME AFBEELDING */

    #geheim-afbeelding {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      max-width: 85vw;
      max-height: 80vh;

      object-fit: contain;

      z-index: 20;

      opacity: 0;
    }

    #geheim-afbeelding.flits {
      animation: geheimFlits 0.7s ease forwards;
    }

    /* EZEL */

    #ezel-afbeelding {
      display: block;

      width: auto;
      height: auto;

      max-width: 75vw;
      max-height: 55vh;

      object-fit: contain;

      margin: 0 auto 10px auto;

      opacity: 0;

      animation: ezelVerschijnen 1.5s ease forwards;
    }

    #ezel-tekst {
      font-size: clamp(25px, 4vw, 48px);

      line-height: 1.4;

      opacity: 0;

      animation:
        afsluitingVerschijnen
        1.5s
        ease
        0.5s
        forwards;
    }

    /* MAGIE */

    #magie {
      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(180, 140, 60, 0.35),
          rgba(50, 35, 10, 0.25) 35%,
          rgba(0, 0, 0, 0.95) 80%
        );

      z-index: 10;
    }

    #magie.actief {
      animation: magisch 2.5s ease-in-out forwards;
    }

    /* ROOK */

    #rook {
      position: fixed;

      inset: -20%;

      pointer-events: none;

      opacity: 0;

      z-index: 11;

      background:

        radial-gradient(
          ellipse at 30% 50%,
          rgba(170, 125, 45, 0.22),
          transparent 45%
        ),

        radial-gradient(
          ellipse at 70% 40%,
          rgba(210, 170, 80, 0.18),
          transparent 40%
        ),

        radial-gradient(
          ellipse at 50% 80%,
          rgba(120, 90, 35, 0.20),
          transparent 45%
        );

      filter: blur(25px);
    }

    #rook.actief {
      animation: rook 2.5s ease-in-out forwards;
    }

    /* SLOTGLOED */

    #slotgloed {
      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(210, 170, 80, 0.32),
          rgba(120, 85, 30, 0.20) 40%,
          rgba(0, 0, 0, 0.90) 85%
        );

      z-index: 12;
    }

    #slotgloed.actief {
      animation: slotgloed 3.5s ease-in-out forwards;
    }

    /* ANIMATIES */

    @keyframes introVerschijnen {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes afbeeldingverschijnen {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes verschijnen {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes beschrijving {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes afsluitingVerschijnen {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes geheimTekst {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes geheimFlits {
      0% {
        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(0.8);
      }

      20% {
        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1);
      }

      75% {
        opacity: 1;
      }

      100% {
        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(1.05);
      }
    }

    @keyframes ezelVerschijnen {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes zachtGloeien {
      0% {
        opacity: 0.65;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.65;
      }
    }

    @keyframes magisch {
      0% {
        opacity: 0;
        transform: scale(1);
      }

      35% {
        opacity: 1;
        transform: scale(1.05);
      }

      70% {
        opacity: 0.7;
        transform: scale(1.15);
      }

      100% {
        opacity: 0;
        transform: scale(1.3);
      }
    }

    @keyframes slotgloed {
      0% {
        opacity: 0;
        transform: scale(1);
      }

      30% {
        opacity: 0.9;
        transform: scale(1.03);
      }

      55% {
        opacity: 0.65;
        transform: scale(1.08);
      }

      100% {
        opacity: 0;
        transform: scale(1.18);
      }
    }

    @keyframes rook {
      0% {
        opacity: 0;

        transform:
          scale(0.8)
          rotate(0deg);
      }

      30% {
        opacity: 1;
      }

      70% {
        opacity: 0.8;

        transform:
          scale(1.1)
          rotate(4deg);
      }

      100% {
        opacity: 0;

        transform:
          scale(1.4)
          rotate(-5deg);
      }
    }

  </style>
</head>


<body>

  <div id="spiegel">

    <div id="magie"></div>

    <div id="rook"></div>

    <div id="slotgloed"></div>

    <div id="scherm">

      <div id="titel">
        ✨ MAGISCHE SPIEGEL ✨
      </div>

      <div id="ondertitel">
        Sprookjesmagie of Sprookjestragedie
      </div>

      <div id="aanraken">
        RAAK HET SCHERM AAN
      </div>

    </div>

  </div>


  <script>

    /* ==========================================
       ROLLEN
       ========================================== */

    const acties = [

      {
        naam: "👑 DE KONINKLIJKE",
        tekst:
          "Je hebt iets koninklijks. Of je doet in ieder geval alsof.",
        afbeelding:
          "koninklijke.png"
      },

      {
        naam: "🦹 DE SCHURK",
        tekst:
          "Je bedoelingen zijn uitstekend. Dat maakt het alleen maar verdacht."
      },

      {
        naam: "🎭 HET NOODLOT",
        tekst:
          "Sommige dingen zijn voorbestemd. Dit was er blijkbaar één van."
      },

      {
        naam: "⭐ DE UITVERKORENE",
        tekst:
          "Het lot heeft jou gekozen. Hopelijk weet het lot wat het doet."
      },

      {
        naam: "🧙 DE MAGIËR",
        tekst:
          "Je bezit grote krachten. Vooral als niemand kijkt.",
        afbeelding:
          "magier.png"
      },

      {
        naam: "🧚 DE BETOVERDE",
        tekst:
          "Er hangt magie om je heen. Of misschien is dat gewoon je uitstraling."
      },

      {
        naam: "🌙 DE RUITER UIT DE MIST",
        tekst:
          "Je verschijnt wanneer niemand je verwacht... zelfs jij niet.",
        afbeelding:
          "ruiter-uit-de-mist.png"
      },

      {
        naam: "🐴 DE VROLIJKE RUITER",
        tekst:
          "Je komt te paard. Waarom? Dat weet niemand."
      }

    ];


    /* ==========================================
       INTRO'S
       ========================================== */

    const intros = [

      "Een zachte mist trekt over het glas... Ergens tussen sprookjesmagie en sprookjestragedie wacht jouw verhaal.",

      "De spiegel kijkt terug... Maar wat ziet hij eigenlijk in jou?",

      "Stil nu... de oude magie wordt wakker.",

      "Niet iedereen die in de spiegel kijkt, krijgt hetzelfde verhaal te zien...",

      "Het sprookje begint. Maar de spiegel twijfelt nog... kies jij de goede kant, of de slechte?"

    ];


    /* ==========================================
       AFSLUITINGEN
       ========================================== */

    const afsluitingen = [

      {
        tekst:
          "De spiegel heeft gesproken... maar sommige geheimen blijven verborgen.",

        actie:
          "geheim1"
      },

      {
        tekst:
          "De magie verdwijnt... maar de spiegel is nog niet uitgesproken.",

        actie:
          "geheim2"
      },

      {
        tekst:
          "Was dit werkelijk jouw lot? Misschien moet je nog eens kijken...",

        actie:
          "ezel"
      },

      {
        tekst:
          "De spiegel zwijgt weer... maar hij heeft jou gezien.",

        actie:
          "oog"
      },

      {
        tekst:
          "Een verhaal eindigt hier... of begint het pas?"
      }

    ];


    /* ==========================================
       ELEMENTEN
       ========================================== */

    const scherm =
      document.getElementById("scherm");

    const magie =
      document.getElementById("magie");

    const rook =
      document.getElementById("rook");

    const slotgloed =
      document.getElementById("slotgloed");


    let bezig = false;


    /* ==========================================
       AFBEELDINGEN VOORAF LADEN
       ========================================== */

    acties.forEach(function(actie) {

      if (actie.afbeelding) {

        const img =
          new Image();

        img.src =
          actie.afbeelding;
      }

    });


    const ezelVoorladen =
      new Image();

    ezelVoorladen.src =
      "ezel.png";


    const prinsHeksVoorladen =
      new Image();

    prinsHeksVoorladen.src =
      "prins-heks.png";


    const oogVoorladen =
      new Image();

    oogVoorladen.src =
      "oog.png";


    /* ==========================================
       BEGIN
       ========================================== */

    function toonBeginScherm() {

      scherm.innerHTML =

        '<div id="titel">' +
          '✨ MAGISCHE SPIEGEL ✨' +
        '</div>' +

        '<div id="ondertitel">' +
          'Sprookjesmagie of Sprookjestragedie' +
        '</div>' +

        '<div id="aanraken">' +
          'RAAK HET SCHERM AAN' +
        '</div>';

    }


    /* ==========================================
       INTRO
       ========================================== */

    function toonIntro() {

      const intro =
        intros[
          Math.floor(
            Math.random() *
            intros.length
          )
        ];


      scherm.innerHTML = "";


      const tekst =
        document.createElement("div");

      tekst.id =
        "intro";

      tekst.textContent =
        intro;

      scherm.appendChild(
        tekst
      );

      scherm.style.opacity =
        "1";

    }


    /* ==========================================
       GEHEIM 1
       ========================================== */

    function toonGeheim1() {

      scherm.style.opacity =
        "0";


      setTimeout(function() {

        scherm.innerHTML = "";


        const tekst =
          document.createElement("div");

        tekst.id =
          "geheim-tekst";

        tekst.textContent =
          "GEHEIM";

        scherm.appendChild(
          tekst
        );


        setTimeout(function() {

          scherm.style.opacity =
            "0";


          setTimeout(function() {

            const afbeelding =
              document.createElement("img");

            afbeelding.id =
              "geheim-afbeelding";

            afbeelding.src =
              "prins-heks.png";

            afbeelding.alt =
              "Een prins die stiekem een heks kust";

            document.body.appendChild(
              afbeelding
            );

            afbeelding.classList.add(
              "flits"
            );


            setTimeout(function() {

              afbeelding.remove();


              scherm.innerHTML =
                '<div id="afsluiting">' +
                'Oeps... dit stond niet in het sprookjesboek.' +
                '</div>';


              scherm.style.opacity =
                "1";


              setTimeout(function() {

                scherm.style.opacity =
                  "0";


                setTimeout(
                  toonLaatsteGloed,
                  800
                );

              }, 4000);


            }, 800);

          }, 700);


        }, 1800);


      }, 800);

    }


    /* ==========================================
       GEHEIM 2
       ========================================== */

    function toonGeheim2() {

      scherm.style.opacity =
        "0";


      setTimeout(function() {

        scherm.innerHTML = "";


        const tekst =
          document.createElement("div");

        tekst.id =
          "geheim-tekst";

        tekst.textContent =
          "Hij weet meer...";

        scherm.appendChild(
          tekst
        );


        scherm.style.opacity =
          "1";


        /*
         * "Hij weet meer..." blijft 2,5 seconden staan.
         */

        setTimeout(function() {

          scherm.style.opacity =
            "0";


          setTimeout(function() {

            scherm.innerHTML =
              '<div id="afsluiting">' +
              'De spiegel heeft je outfit eens goed bekeken... Je kunt die kans op de prijs wel vergeten.' +
              '</div>';


            scherm.style.opacity =
              "1";


            /*
             * Outfittekst blijft 6 seconden staan.
             */

            setTimeout(function() {

              scherm.style.opacity =
                "0";


              setTimeout(
                toonLaatsteGloed,
                800
              );

            }, 6000);


          }, 700);


        }, 2500);


      }, 800);

    }


    /* ==========================================
       EZEL
       ========================================== */

    function toonEzel() {

      scherm.style.opacity =
        "0";


      setTimeout(function() {

        scherm.innerHTML = "";


        const afbeelding =
          document.createElement("img");


        afbeelding.id =
          "ezel-afbeelding";


        afbeelding.src =
          "ezel.png";


        afbeelding.alt =
          "Een onverwachte ezel";


        scherm.appendChild(
          afbeelding
        );


        const tekst =
          document.createElement("div");


        tekst.id =
          "ezel-tekst";


        tekst.textContent =
          "O... Dit had de spiegel niet verwacht.";


        scherm.appendChild(
          tekst
        );


        scherm.style.opacity =
          "1";


        /*
         * Ezel blijft 5 seconden staan.
         */

        setTimeout(function() {

          scherm.style.opacity =
            "0";


          setTimeout(function() {

            toonLaatsteGloed();

          }, 800);

        }, 5000);

      }, 800);

    }


    /* ==========================================
       OOG
       ========================================== */

    function toonOog() {

      scherm.style.opacity =
        "0";


      setTimeout(function() {

        scherm.innerHTML =
          "";


        const afbeelding =
          document.createElement("img");


        afbeelding.id =
          "geheim-afbeelding";


        afbeelding.src =
          "oog.png";


        afbeelding.alt =
          "Een gigantisch oog";


        document.body.appendChild(
          afbeelding
        );


        afbeelding.classList.add(
          "flits"
        );


        /*
         * Korte onverwachte schrikflits.
         */

        setTimeout(function() {

          afbeelding.remove();

          toonLaatsteGloed();

        }, 800);


      }, 500);

    }


    /* ==========================================
       LAATSTE GOUDEN GLOED
       ========================================== */

    function toonLaatsteGloed() {

      slotgloed.classList.remove(
        "actief"
      );


      void slotgloed.offsetWidth;


      slotgloed.classList.add(
        "actief"
      );


      setTimeout(function() {

        toonBeginScherm();

        scherm.style.opacity =
          "1";

        bezig =
          false;

      }, 3500);

    }


    /* ==========================================
       AFSLUITING
       ========================================== */

    function toonAfsluiting() {

      const gekozen =
        afsluitingen[
          Math.floor(
            Math.random() *
            afsluitingen.length
          )
        ];


      scherm.style.opacity =
        "0";


      setTimeout(function() {

        scherm.innerHTML = "";


        const tekst =
          document.createElement("div");


        tekst.id =
          "afsluiting";


        tekst.textContent =
          gekozen.tekst;


        scherm.appendChild(
          tekst
        );


        scherm.style.opacity =
          "1";


        /*
         * Afsluitende tekst blijft 8 seconden staan.
         */

        setTimeout(function() {


          if (
            gekozen.actie ===
            "geheim1"
          ) {

            toonGeheim1();

            return;
          }


          if (
            gekozen.actie ===
            "geheim2"
          ) {

            toonGeheim2();

            return;
          }


          if (
            gekozen.actie ===
            "ezel"
          ) {

            toonEzel();

            return;
          }


          if (
            gekozen.actie ===
            "oog"
          ) {

            toonOog();

            return;
          }


          scherm.style.opacity =
            "0";


          setTimeout(
            toonLaatsteGloed,
            800
          );


        }, 8000);


      }, 800);

    }


    /* ==========================================
       AANRAKEN
       ========================================== */

    scherm.addEventListener(
      "click",
      function() {

        if (bezig) {
          return;
        }


        bezig =
          true;


        /*
         * Eerst een intro.
         */

        toonIntro();


        /*
         * Intro blijft 8 seconden.
         */

        setTimeout(function() {


          magie.classList.remove(
            "actief"
          );

          rook.classList.remove(
            "actief"
          );


          void magie.offsetWidth;
          void rook.offsetWidth;


          magie.classList.add(
            "actief"
          );

          rook.classList.add(
            "actief"
          );


          scherm.style.opacity =
            "0";


          /*
           * Daarna komt de rol.
           */

          setTimeout(function() {


            const willekeurig =
              acties[
                Math.floor(
                  Math.random() *
                  acties.length
                )
              ];


            scherm.innerHTML =
              "";


            /*
             * Afbeelding als die bestaat.
             */

            if (
              willekeurig.afbeelding
            ) {

              const afbeelding =
                document.createElement("img");


              afbeelding.id =
                "rol-afbeelding";


              afbeelding.src =
                willekeurig.afbeelding;


              afbeelding.alt =
                willekeurig.naam;


              scherm.appendChild(
                afbeelding
              );

            }


            /*
             * Rolnaam.
             */

            const uitkomst =
              document.createElement("div");


            uitkomst.id =
              "uitkomst";


            uitkomst.textContent =
              willekeurig.naam;


            scherm.appendChild(
              uitkomst
            );


            /*
             * Beschrijving.
             */

            const beschrijving =
              document.createElement("div");


            beschrijving.id =
              "beschrijving";


            beschrijving.textContent =
              willekeurig.tekst;


            scherm.appendChild(
              beschrijving
            );


            scherm.style.opacity =
              "1";


            /*
             * De rol blijft 8 seconden zichtbaar.
             */

            setTimeout(
              toonAfsluiting,
              8000
            );


          }, 1700);


        }, 8000);

      }
    );


    /* ==========================================
       SERVICE WORKER
       ========================================== */

    if ("serviceWorker" in navigator) {

      navigator.serviceWorker.register(
        "service-worker.js"
      );

    }

  </script>
