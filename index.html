<!DOCTYPE html>

<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Magische Spiegel</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }

    #scherm {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 25px;
      padding: 30px;
      box-sizing: border-box;
    }

    #scherm small {
      font-size: 4vw;
      font-weight: normal;
    }

    #scherm strong {
      font-size: 6vw;
      font-weight: normal;
    }
  </style>

</head>

<body>

  <div id="scherm">
    <div>✨ MAGISCHE SPIEGEL ✨</div>
    <small>Sprookjesmagie of Sprookjestragedie</small>
    <strong>RAAK HET SCHERM AAN</strong>
  </div>

  <script>
    const acties = [
      "👑 DE KONINKLIJKE",
      "🦹 DE SCHURK",
      "🎭 HET NOODLOT",
      "⭐ DE UITVERKORENE",
      "🧙 DE MAGIËR",
      "🧚 DE BETOVERDE",
      "🌙 DE RUITER UIT DE MIST",
      "🐴 DE VROLIJKE RUITER"
    ];

    const scherm = document.getElementById("scherm");

    scherm.addEventListener("click", function () {
      const willekeurig =
        acties[Math.floor(Math.random() * acties.length)];

      scherm.textContent = willekeurig;
    });

    // Service Worker inschakelen voor offline gebruik
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

</body>
</html>
