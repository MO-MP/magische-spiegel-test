<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<title>Magische Spiegel</title>

<style>

/* ==========================================
   BASIS
   ========================================== */

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: black;

  font-family: Georgia, "Times New Roman", serif;

  color: white;

}


/* ==========================================
   SPIEGEL
   ========================================== */

#spiegel {

  position: fixed;

  inset: 0;

  width: 100vw;
  height: 100vh;

  background-image: url("spiegel.png");

  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;

}


/* ==========================================
   SCHERM
   ========================================== */

#scherm {

  position: fixed;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 40px;

  box-sizing: border-box;

  transition: opacity 0.8s ease;

}


/* ==========================================
   STARTSCHERM
   ========================================== */

#start {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  width: 100%;
  height: 100%;

}


#titel {

  font-size: clamp(36px, 7vw, 80px);

  text-shadow:
    0 0 15px rgba(255,255,255,0.7),
    0 0 35px rgba(180,160,255,0.7);

  margin-bottom: 35px;

}


#taal-keuze {

  display: flex;

  gap: 25px;

  margin-bottom: 40px;

}


.taal {

  padding: 12px 25px;

  border: 1px solid rgba(255,255,255,0.7);

  border-radius: 30px;

  background: rgba(0,0,0,0.35);

  color: white;

  font-size: 22px;

  cursor: pointer;

}


.taal.gekozen {

  background: rgba(255,255,255,0.25);

  box-shadow:
    0 0 15px rgba(255,255,255,0.5);

}


#aanraken {

  font-size: clamp(22px, 4vw, 40px);

  opacity: 0.85;

  animation: zachtKnipperen 2s ease-in-out infinite;

}


@keyframes zachtKnipperen {

  0%,
  100% {
    opacity: 0.35;
  }

  50% {
    opacity: 1;
  }

}


/* ==========================================
   INTRO
   ========================================== */

#intro {

  max-width: 1100px;

  font-size: clamp(28px, 5vw, 58px);

  line-height: 1.35;

  text-shadow:
    0 0 15px rgba(255,255,255,0.8),
    0 0 35px rgba(180,160,255,0.8);

}


/* ==========================================
   ROL
   ========================================== */

#rol-afbeelding {

  max-width: 75vw;
  max-height: 58vh;

  object-fit: contain;

  opacity: 0;

  animation:
    rolBinnen 1.5s ease forwards;

  filter:
    drop-shadow(0 0 30px rgba(255,255,255,0.45));

}


@keyframes rolBinnen {

  from {

    opacity: 0;

    transform:
      scale(0.75);

  }

  to {

    opacity: 1;

    transform:
      scale(1);

  }

}


#rol-tekst {

  position: absolute;

  left: 50%;

  bottom: 8vh;

  transform:
    translateX(-50%);

  width: 90%;

  max-width: 1100px;

  font-size: clamp(25px, 4.5vw, 50px);

  line-height: 1.3;

  text-shadow:
    0 0 12px black,
    0 0 25px rgba(255,255,255,0.6);

  opacity: 0;

  animation:
    tekstBinnen 1.5s ease forwards;

}


@keyframes tekstBinnen {

  from {
    opacity: 0;
    transform:
      translateX(-50%)
      translateY(20px);
  }

  to {
    opacity: 1;
    transform:
      translateX(-50%)
      translateY(0);
  }

}


/* ==========================================
   AFSLUITING
   ========================================== */

#afsluiting {

  max-width: 1100px;

  font-size: clamp(30px, 5vw, 60px);

  line-height: 1.35;

  text-shadow:
    0 0 15px rgba(255,255,255,0.8),

}


#afsluiting span {

  display: block;

}


/* ==========================================
   GEHEIM
   ========================================== */

#geheim-titel {

  font-size: clamp(45px, 10vw, 110px);

  letter-spacing: 0.2em;

  text-shadow:
    0 0 20px white,
    0 0 50px #9b7cff;

}


/* ==========================================
   GEHEIME AFBEELDING
   ========================================== */

#geheim-afbeelding {

  max-width: 90vw;
  max-height: 75vh;

  object-fit: contain;

  filter:
    drop-shadow(0 0 35px rgba(255,255,255,0.5));

}


/* ==========================================
   EZEL
   ========================================== */

#ezel-afbeelding {

  max-width: 90vw;
  max-height: 75vh;

  object-fit: contain;

  filter:
    drop-shadow(0 0 30px rgba(255,255,255,0.45));

}


/* ==========================================
   OOG
   ========================================== */

#oog-afbeelding {

  max-width: 90vw;
  max-height: 75vh;

  object-fit: contain;

  filter:
    drop-shadow(0 0 40px rgba(255,255,255,0.6));

}


/* ==========================================
   VERGADERING
   ========================================== */

#vergadering-afbeelding {

  position: fixed;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: 100vw;
  height: 100vh;

  max-width: 100%;
  max-height: 100%;

  object-fit: contain;

  z-index: 20;

  opacity: 0;

  filter:
    drop-shadow(
      0 0 30px
      rgba(255,255,255,0.35)
    );

  -webkit-mask-image:
    radial-gradient(
      ellipse at center,
      black 42%,
      rgba(0,0,0,0.95) 58%,
      rgba(0,0,0,0.65) 72%,
      transparent 94%
    );

  mask-image:
    radial-gradient(
      ellipse at center,
      black 42%,
      rgba(0,0,0,0.95) 58%,
      rgba(0,0,0,0.65) 72%,
      transparent 94%
    );

}


#vergadering-afbeelding.flits {

  animation:
    vergaderingFlits 10s ease forwards;

}


#vergadering-laatste {

  display: block;

  opacity: 0;

  margin-top: 14px;

  animation:
    vergaderingLaatste
    1.2s ease
    1.8s forwards;

}


@keyframes vergaderingFlits {

  0% {

    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(0.88);

  }

  12% {

    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);

  }

  88% {

    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);

  }

  100% {

    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(1.04);

  }

}


@keyframes vergaderingLaatste {

  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }

}


/* ==========================================
   MAGIE
   ========================================== */

#magie {

  position: fixed;

  inset: 0;

  pointer-events: none;

  opacity: 0;

  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,0.9),
      rgba(180,150,255,0.4) 25%,
      rgba(0,0,0,0) 70%
    );

  z-index: 15;

}


#magie.actief {

  animation:
    magieFlits 2.5s ease forwards;

}


@keyframes magieFlits {

  0% {
    opacity: 0;
    transform: scale(0.5);
  }

  40% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform: scale(1.5);
  }

}


/* ==========================================
   ROOK
   ========================================== */

#rook {

  position: fixed;

  inset: 0;

  pointer-events: none;

  opacity: 0;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,0.3),
      transparent 65%
    );

  z-index: 14;

}


#rook.actief {

  animation:
    rookBeweging 3s ease forwards;

}


@keyframes rookBeweging {

  0% {
    opacity: 0;
    transform: scale(0.8);
  }

  35% {
    opacity: 0.8;
  }

  100% {
    opacity: 0;
    transform: scale(1.3);
  }

}


/* ==========================================
   LAATSTE GLOED
   ========================================== */

#gloed {

  position: fixed;

  inset: 0;

  pointer-events: none;

  opacity: 0;

  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,0.95),
      rgba(200,180,255,0.45) 30%,
      rgba(0,0,0,0) 75%
    );

  z-index: 30;

}


#gloed.actief {

  animation:
    laatsteGloed 2s ease forwards;

}


@keyframes laatsteGloed {

  0% {
    opacity: 0;
  }

  45% {
    opacity: 1;
  }

  100% {
    opacity: 0;
  }

}


/* ==========================================
   MOBIEL
   ========================================== */

@media (max-width: 600px) {

  #scherm {
    padding: 25px;
  }

  #titel {
    font-size: 42px;
  }

  #aanraken {
    font-size: 24px;
  }

}


/* ==========================================
   IPAD LANDSCAPE
   ========================================== */

@media (orientation: landscape) {

  #rol-afbeelding {

    max-height: 62vh;

  }

}

</style>

</head>


<body>

<div id="spiegel"></div>

<div id="scherm"></div>

<div id="magie"></div>

<div id="rook"></div>

<div id="gloed"></div>


<script>

/* ==========================================
   VARIABELEN
   ========================================== */

const scherm =
  document.getElementById("scherm");

const magie =
  document.getElementById("magie");

const rook =
  document.getElementById("rook");

const gloed =
  document.getElementById("gloed");


let taal = "nl";

let bezig = false;


/* ==========================================
   ZAKKEN / SHUFFLE
   ========================================== */

let introZakken = {
  nl: [],
  fr: []
};

let rolZak = [];

let afsluitingZakken = {
  nl: [],
  fr: []
};


function maakZak(lijst) {

  const zak = [...lijst];

  for (
    let i = zak.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      zak[i],
      zak[j]
    ] =
    [
      zak[j],
      zak[i]
    ];

  }

  return zak;

}


function pakUitZak(lijst, zak) {

  if (zak.length === 0) {

    zak.push(
      ...maakZak(lijst)
    );

  }

  return zak.pop();

}


/* ==========================================
   INTRO'S
   ========================================== */

const intros = {

  nl: [

    "Een zachte mist trekt over het glas... Ergens tussen sprookjesmagie en sprookjestragedie wacht jouw verhaal.",

    "De spiegel kijkt terug... Maar wat ziet hij eigenlijk in jou?",

    "Stil nu... de oude magie wordt wakker.",

    "Niet iedereen die in de spiegel kijkt, krijgt hetzelfde verhaal te zien...",

    "Het sprookje begint. Maar de spiegel twijfelt nog... kies jij de goede kant, of de slechte?",

    "Oei... er zit wat magie in de drank. De spiegel krijgt je maar moeilijk scherp in beeld."

  ],

  fr: [

    "Une douce brume traverse le miroir... Quelque part entre magie et tragédie de conte de fées, ton histoire t'attend.",

    "Le miroir te regarde... Mais que voit-il vraiment en toi ?",

    "Silence maintenant... l'ancienne magie se réveille.",

    "Tout le monde ne voit pas la même histoire en regardant dans le miroir...",

    "Le conte commence. Mais le miroir hésite encore... choisiras-tu le bon côté, ou le mauvais ?",

    "Oups... il y a un peu de magie dans la boisson. Le miroir a du mal à te voir clairement."

  ]

};


/* ==========================================
   ROLLEN
   ========================================== */

const acties = [

  {
    naam: {
      nl: "De Koninklijke",
      fr: "Le Royal"
    },

    tekst: {
      nl: "Je straalt als iemand van adel. De spiegel ziet koninklijk bloed in jou.",
      fr: "Tu rayonnes comme quelqu'un de noble. Le miroir voit du sang royal en toi."
    },

    afbeelding: "koninklijke.png"
  },


  {
    naam: {
      nl: "De Schurk",
      fr: "Le Vilain"
    },

    tekst: {
      nl: "De spiegel vertrouwt je niet helemaal... Er zit iets duisters in jouw verhaal.",
      fr: "Le miroir ne te fait pas totalement confiance... Il y a quelque chose de sombre dans ton histoire."
    },

    afbeelding: "schurk.png"
  },


  {
    naam: {
      nl: "Het Noodlot",
      fr: "Le Destin"
    },

    tekst: {
      nl: "Het noodlot heeft je gevonden. Of misschien heb jij het noodlot gevonden.",
      fr: "Le destin t'a trouvé. Ou peut-être est-ce toi qui as trouvé le destin."
    },

    afbeelding: "het-noodlot.png"
  },


  {
    naam: {
      nl: "De Uitverkorene",
      fr: "L'Élu"
    },

    tekst: {
      nl: "De sterren hebben gesproken. Jij bent degene die het verhaal moet veranderen.",
      fr: "Les étoiles ont parlé. C'est toi qui dois changer l'histoire."
    },

    afbeelding: "uitverkorene.png"
  },


  {
    naam: {
      nl: "De Magiër",
      fr: "Le Magicien"
    },

    tekst: {
      nl: "De magie stroomt door je heen. Misschien weet je zelf nog niet hoeveel kracht je hebt.",
      fr: "La magie coule en toi. Peut-être ne sais-tu pas encore combien de pouvoir tu possèdes."
    },

    afbeelding: "magier.png"
  },


  {
    naam: {
      nl: "De Betoverde",
      fr: "L'Enchanté"
    },

    tekst: {
      nl: "Er is iets met je gebeurd... De spiegel ziet dat je betoverd bent.",
      fr: "Quelque chose t'est arrivé... Le miroir voit que tu es enchanté."
    },

    afbeelding: "betoverde.png"
  },


  {
    naam: {
      nl: "De Ruiter uit de Mist",
      fr: "Le Cavalier de la Brume"
    },

    tekst: {
      nl: "Uit de mist kwam jij tevoorschijn. Niemand weet precies waarom.",
      fr: "Tu es apparu dans la brume. Personne ne sait vraiment pourquoi."
    },

    afbeelding: "ruiter-uit-de-mist.png"
  },


  {
    naam: {
      nl: "De Vrolijke Ruiter",
      fr: "Le Cavalier Joyeux"
    },

    tekst: {
      nl: "Met een glimlach en een goed humeur rijd jij het sprookje binnen.",
      fr: "Avec un sourire et de bonne humeur, tu entres dans le conte."
    },

    afbeelding: "vrolijke-ruiter.png"
  }

];


/* ==========================================
   AFSLUITINGEN
   ========================================== */

const afsluitingen = {

  nl: [

    {
      tekst: "De spiegel heeft gesproken... maar sommige geheimen blijven verborgen.",
      actie: "geheim1"
    },

    {
      tekst: "De magie verdwijnt... maar de spiegel is nog niet uitgesproken.",
      actie: "geheim2"
    },

    {
      tekst: "Was dit werkelijk jouw lot? Misschien moet je nog eens kijken...",
      actie: "ezel"
    },

    {
      tekst: "De spiegel zwijgt weer... maar hij heeft jou gezien.",
      actie: "oog"
    },

    {
      tekst: "Er is één ding dat je moet weten…",
      actie: "vergadering"
    }

  ],

  fr: [

    {
      tekst: "Le miroir a parlé... mais certains secrets restent cachés.",
      actie: "geheim1"
    },

    {
      tekst: "La magie disparaît... mais le miroir n'a pas encore tout dit.",
      actie: "geheim2"
    },

    {
      tekst: "Était-ce vraiment ton destin ? Peut-être devrais-tu regarder encore une fois...",
      actie: "ezel"
    },

    {
      tekst: "Le miroir se tait à nouveau... mais il t'a vu.",
      actie: "oog"
    },

    {
      tekst: "Il y a une chose que tu dois savoir…",
      actie: "vergadering"
    }

  ]

};


/* ==========================================
   STARTSCHERM
   ========================================== */

function toonStart() {

  scherm.style.opacity = "1";

  scherm.innerHTML =

    '<div id="start">' +

      '<div id="titel">' +
        "Magische Spiegel" +
      "</div>" +

      '<div id="taal-keuze">' +

        '<div class="taal gekozen" id="nl">' +
          "Nederlands" +
        "</div>" +

        '<div class="taal" id="fr">' +
          "Français" +
        "</div>" +

      "</div>" +

      '<div id="aanraken">' +
        "Raak de spiegel aan" +
      "</div>" +

    "</div>";


  document
    .getElementById("nl")
    .addEventListener(
      "click",
      function(e) {

        e.stopPropagation();

        taal = "nl";

        document
          .getElementById("nl")
          .classList.add("gekozen");

        document
          .getElementById("fr")
          .classList.remove("gekozen");

        document
          .getElementById("aanraken")
          .textContent =
          "Raak de spiegel aan";

      }
    );


  document
    .getElementById("fr")
    .addEventListener(
      "click",
      function(e) {

        e.stopPropagation();

        taal = "fr";

        document
          .getElementById("fr")
          .classList.add("gekozen");

        document
          .getElementById("nl")
          .classList.remove("gekozen");

        document
          .getElementById("aanraken")
          .textContent =
          "Touchez le miroir";

      }
    );

}


/* ==========================================
   INTRO
   ========================================== */

function toonIntro() {

  const tekst =
    pakUitZak(
      intros[taal],
      introZakken[taal]
    );

  scherm.style.opacity = "1";

  scherm.innerHTML =
    '<div id="intro">' +
      tekst +
    "</div>";


  setTimeout(
    startMagie,
    4500
  );

}


/* ==========================================
   MAGIE
   ========================================== */

function startMagie() {

  magie.classList.remove("actief");

  rook.classList.remove("actief");

  void magie.offsetWidth;
  void rook.offsetWidth;

  magie.classList.add("actief");

  rook.classList.add("actief");


  setTimeout(
    toonRol,
    1800
  );

}


/* ==========================================
   ROL
   ========================================== */

function toonRol() {

  const gekozen =
    pakUitZak(
      acties,
      rolZak
    );


  scherm.style.opacity = "0";


  setTimeout(
    function() {

      scherm.innerHTML =

        '<img id="rol-afbeelding" src="' +
        gekozen.afbeelding +
        '" alt="' +
        gekozen.naam[taal] +
        '">' +

        '<div id="rol-tekst">' +

          "<strong>" +
          gekozen.naam[taal] +
          "</strong>" +

          "<br><br>" +

          gekozen.tekst[taal] +

        "</div>";


      scherm.style.opacity = "1";


      setTimeout(
        function() {

          const tekst =
            document.getElementById(
              "rol-tekst"
            );

          if (tekst) {

            tekst.style.opacity = "1";

          }

        },
        2000
      );


      setTimeout(
        function() {

          scherm.style.opacity = "0";

          setTimeout(
            function() {

              toonAfsluiting(
                gekozen
              );

            },
            800
          );

        },
        11000
      );

    },
    800
  );

}


/* ==========================================
   AFSLUITING
   ========================================== */

function toonAfsluiting(gekozen) {

  const afsluiting =
    pakUitZak(
      afsluitingen[taal],
      afsluitingZakken[taal]
    );


  scherm.innerHTML =
    '<div id="afsluiting">' +
      afsluiting.tekst +
    "</div>";


  scherm.style.opacity = "1";


  if (
    afsluiting.actie ===
    "vergadering"
  ) {

    setTimeout(
      toonVergadering,
      3000
    );

    return;

  }


  setTimeout(
    function() {

      if (
        afsluiting.actie ===
        "geheim1"
      ) {

        toonGeheim1();

      }

      else if (
        afsluiting.actie ===
        "geheim2"
      ) {

        toonGeheim2();

      }

      else if (
        afsluiting.actie ===
        "ezel"
      ) {

        toonEzel();

      }

      else if (
        afsluiting.actie ===
        "oog"
      ) {

        toonOog();

      }

    },
    3000
  );

}


/* ==========================================
   VERGADERING
   ========================================== */

function toonVergadering() {

  scherm.style.opacity = "0";


  setTimeout(
    function() {

      scherm.innerHTML = "";


      const afbeelding =
        document.createElement("img");


      afbeelding.id =
        "vergadering-afbeelding";


      afbeelding.src =
        "vergadering.png";


      afbeelding.alt =
        taal === "nl"
          ? "Een sprookjesvergadering"
          : "Une réunion de conte de fées";


      document.body.appendChild(
        afbeelding
      );


      afbeelding.classList.add(
        "flits"
      );


      /*
       * DE VERGADERING BLIJFT NU
       * 10 SECONDEN IN BEELD.
       */

      setTimeout(
        function() {

          afbeelding.remove();


          scherm.innerHTML =

            '<div id="afsluiting">' +

              (

                taal === "nl"

                  ?

                  "Zo is je lot beslist." +

                  '<span id="vergadering-laatste">' +

                    "Ze waren het verrassend snel eens." +

                  "</span>"

                  :

                  "Voilà. Ton destin est décidé." +

                  '<span id="vergadering-laatste">' +

                    "Ils se sont mis d'accord étonnamment vite." +

                  "</span>"

              ) +

            "</div>";


          scherm.style.opacity = "1";


          setTimeout(
            function() {

              scherm.style.opacity = "0";


              setTimeout(
                toonLaatsteGloed,
                800
