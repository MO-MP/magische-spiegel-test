    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, serif;
      background: black;

    body {

      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }


    /* ==========================================
       SPIEGEL
       ========================================== */

    #spiegel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background-image: url("spiegel.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #spiegel::before {
      content: "";
      position: absolute;
      inset: 0;

      background: rgba(0, 0, 0, 0.30);

      pointer-events: none;
      z-index: 1;
    }


    /* ==========================================
       SCHERM
       ========================================== */

    #scherm {
      position: relative;
      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 18px;

      padding: 30px;
      box-sizing: border-box;

      transition: opacity 0.8s ease;

      cursor: pointer;
    }


    /* ==========================================
       BEGIN
       ========================================== */

    #titel {
      font-size: clamp(38px, 6vw, 70px);
      font-weight: normal;
      white-space: nowrap;
    }

    #ondertitel {
      font-size: clamp(20px, 3vw, 38px);
      font-weight: normal;
    }

    #aanraken {
      font-size: clamp(25px, 4vw, 48px);
      font-weight: normal;

      animation:
        zachtGloeien
        2.5s
        ease-in-out
        infinite;
    }

    #taalkeuze {
      font-size: clamp(15px, 2vw, 24px);
      opacity: 0.75;
      margin-top: 5px;
    }

    #taalkeuze span {
      padding: 5px 10px;
      display: inline-block;
      cursor: pointer;
    }

    #taalkeuze .actief {
      opacity: 1;
      text-decoration: underline;
    }


    /* ==========================================
       INTRO
       ========================================== */

    #intro {
      font-size: clamp(25px, 4vw, 48px);
      line-height: 1.5;

      max-width: 85vw;

      padding: 0 30px;

      box-sizing: border-box;

      opacity: 0;

      animation:
        introVerschijnen
        2s
        ease
        forwards;
    }


    /* ==========================================
       GROTE ROLAFBEELDING
       ========================================== */

    #rol-foto-laag {
      position: fixed;

      inset: 0;

      z-index: 6;

      display: flex;

      align-items: center;
      justify-content: center;

      pointer-events: none;

      opacity: 0;

      animation:
        fotoVerschijnen
        1.5s
        ease
        forwards;
    }

    #rol-foto {
      position: absolute;

      width: 100vw;
      height: 100vh;

      object-fit: contain;

      max-width: 100%;
      max-height: 100%;

      filter:
        drop-shadow(
          0 0 25px
          rgba(0,0,0,0.65)
        );

      -webkit-mask-image:
        radial-gradient(
          ellipse at center,
          black 42%,
          rgba(0,0,0,0.95) 58%,
          rgba(0,0,0,0.65) 72%,
          transparent 94%

        radial-gradient(

          black 42%,
          rgba(0,0,0,0.95) 58%,
          rgba(0,0,0,0.65) 72%,
          transparent 94%

       ========================================== */

    @keyframes fotoVerschijnen {

    @keyframes tekstLater {

      }

    @keyframes introVerschijnen {

      }

      }

      }

      }

        transform: scale(0.7);
      }

      to {

        transform: scale(1);
      }

    }


    @keyframes zachtGloeien {

      0% {
        opacity: 0.65;
      }

        opacity: 1;
      }

      100% {
        opacity: 0.65;
      }

    }


    @keyframes magisch {

      0% {
        opacity: 0;
        transform: scale(1);
      }

      35% {
        opacity: 1;
        transform: scale(1.05);
      }

      70% {
        opacity: 0.7;
        transform: scale(1.15);
      }

      100% {
        opacity: 0;
        transform: scale(1.3);
      }

    }


    @keyframes slotgloed {

      0% {
        opacity: 0;
        transform: scale(1);
      }

      30% {

        transform: scale(1.03);
      }

      55% {

      }

    @keyframes rook {

       EASTER EGG ANIMATIES
       ========================================== */

        transform:
          translateX(-50%)
          translateY(0);
      }

    }

  </style>
