<!DOCTYPE html>

<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Magische Spiegel</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }

    #scherm {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 30px;
      box-sizing: border-box;
    }

    /* Hoofdtitel */
    #titel {
      font-size: clamp(45px, 8vw, 100px);
      font-weight: normal;
    }

    /* Ondertitel */
    #ondertitel {
      font-size: clamp(22px, 3.5vw, 45px);
      font-weight: normal;
    }

    /* Aanwijzing om te tikken */
    #aanraken {
      font-size: clamp(28px, 4.5vw, 55px);
      font-weight: normal;
    }

    /* De uiteindelijke uitkomst */
    #uitkomst {
      font-size: clamp(45px, 8vw, 110px);
      font-weight: normal;
    }
  </style>

</head>

<body>

  <div id="scherm">

```
<div id="titel">✨ MAGISCHE SPIEGEL ✨</div>

<div id="ondertitel">
  Sprookjesmagie of Sprookjestragedie
</div>

<div id="aanraken">
  RAAK HET SCHERM AAN
</div>
```

  </div>

  <script>
    const acties = [
      "👑 DE KONINKLIJKE",
      "🦹 DE SCHURK",
      "🎭 HET NOODLOT",
      "⭐ DE UITVERKORENE",
      "🧙 DE MAGIËR",
      "🧚 DE BETOVERDE",
      "🌙 DE RUITER UIT DE MIST",
      "🐴 DE VROLIJKE RUITER"
    ];

    const scherm = document.getElementById("scherm");

    scherm.addEventListener("click", function () {

      const willekeurig =
        acties[Math.floor(Math.random() * acties.length)];

      scherm.innerHTML =
        '<div id="uitkomst">' + willekeurig + '</div>';

    });

    // Service Worker inschakelen voor offline gebruik
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

</body>
</html>
