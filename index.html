  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family: Georgia, serif;

      background: black;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

      box-sizing: border-box;
    }


    body {

      color: white;

      text-align: center;

      user-select: none;

      -webkit-user-select: none;

      -webkit-touch-callout: none;

      overscroll-behavior: none;

      -webkit-overflow-scrolling: auto;
    }


    /* ==========================================
       SPIEGEL
       ========================================== */

    #spiegel {

      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background-image:
        url("spiegel.png");

      background-size: cover;

      background-position: center;

      background-repeat: no-repeat;
    }


    #spiegel::before {

      content: "";

      position: absolute;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.30);

      pointer-events: none;

      z-index: 1;
    }


    /* ==========================================
       SCHERM
       ========================================== */

    #scherm {

      position: relative;

      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 18px;

      padding: 30px;

      box-sizing: border-box;

      transition:
        opacity 0.8s ease;

      cursor: pointer;
    }


    /* ==========================================
       BEGIN
       ========================================== */

    #titel {

      font-size:
        clamp(38px, 6vw, 70px);

      font-weight: normal;

      white-space: nowrap;
    }


    #ondertitel {

      font-size:
        clamp(20px, 3vw, 38px);

      font-weight: normal;
    }


    #aanraken {

      font-size:
        clamp(25px, 4vw, 48px);

      font-weight: normal;

      animation:
        zachtGloeien
        2.5s
        ease-in-out
        infinite;
    }


    #taalkeuze {

      font-size:
        clamp(15px, 2vw, 24px);

      opacity: 0.75;

      margin-top: 5px;
    }


    #taalkeuze span {

      padding: 5px 10px;

      display: inline-block;

      cursor: pointer;
    }


    #taalkeuze .actief {

      opacity: 1;

      text-decoration: underline;
    }


    /* ==========================================
       INTRO
       ========================================== */

    #intro {

      font-size:
        clamp(25px, 4vw, 48px);

      line-height: 1.5;

      max-width: 85vw;

      padding: 0 30px;

      box-sizing: border-box;

      opacity: 0;

      animation:
        introVerschijnen
        2s
        ease
        forwards;
    }


    /* ==========================================
       GROTE ROLAFBEELDING
       ========================================== */

    #rol-foto-laag {

      position: fixed;

      inset: 0;

      z-index: 6;

      display: flex;

      align-items: center;

      justify-content: center;

      pointer-events: none;

      opacity: 0;

      animation:
        fotoVerschijnen
        1.5s
        ease
        forwards;
    }


    #rol-foto {

      position: absolute;

      width: 100vw;

      height: 100vh;

      object-fit: contain;

      max-width: 100%;

      max-height: 100%;

      filter:
        drop-shadow(
          0 0 25px
          rgba(0,0,0,0.65)
        );

      -webkit-mask-image:
        radial-gradient(
          ellipse at center,
          black 42%,
          rgba(0,0,0,0.95) 58%,
          rgba(0,0,0,0.65) 72%,
          transparent 94%
        );

      mask-image:
        radial-gradient(
          ellipse at center,
          black 42%,
          rgba(0,0,0,0.95) 58%,
          rgba(0,0,0,0.65) 72%,
          transparent 94%
        );
    }


    /* ==========================================
       TEKST OVER DE FOTO
       ========================================== */

    #rol-tekst {

      position: fixed;

      left: 50%;

      top: 8vh;

      transform:
        translateX(-50%);

      z-index: 8;

      width: 92vw;

      max-width: 1200px;

      height: 84vh;

      opacity: 0;

      pointer-events: none;

      text-align: center;

      animation:
        tekstLater
        1.2s
        ease
        2s
        forwards;
    }


    /* ==========================================
       ROLNAAM BOVENIN
       ========================================== */

    #uitkomst {

      position: absolute;

      top: 0;

      left: 50%;

      transform:
        translateX(-50%);

       ONDERZIN ONDERIN
       ========================================== */

    #beschrijving {

       AFSLUITING
       ========================================== */

      padding: 0 30px;

      box-sizing: border-box;

      animation:
        afsluitingVerschijnen
        2s
        ease
        forwards;
    }

       GEHEIM
       ========================================== */

    #geheim-tekst {

      opacity: 0;

      animation:
        geheimTekst
        1.5s
        ease
        forwards;
    }


    /* ==========================================
       GEHEIME AFBEELDING
       ========================================== */

    #geheim-afbeelding {

      position: fixed;

      left: 50%;

      top: 50%;

      transform:
        translate(-50%, -50%);

      max-width: 90vw;

      max-height: 90vh;

      object-fit: contain;

      z-index: 20;

      opacity: 0;

      filter:
        drop-shadow(
          0 0 30px

        );

      -webkit-mask-image:
        radial-gradient(
          ellipse at center,
          black 42%,
          rgba(0,0,0,0.95) 58%,
          rgba(0,0,0,0.65) 72%,
          transparent 94%
        );

      mask-image:
        radial-gradient(
          ellipse at center,
          black 42%,
          rgba(0,0,0,0.95) 58%,
          rgba(0,0,0,0.65) 72%,
          transparent 94%
        );
    }


    #geheim-afbeelding.flits {

      animation:
        geheimFlits
        2.5s
        ease
        forwards;
    }


    /* ==========================================
       EZEL
       ========================================== */

    #ezel-afbeelding {

      display: block;

      width: 100vw;

      height: 100vh;

      max-width: 100%;

      max-height: 100%;

      object-fit: contain;

      margin: 0 auto;

      opacity: 0;

      -webkit-mask-image:
        radial-gradient(
          ellipse at center,
          black 42%,
          rgba(0,0,0,0.95) 58%,
          rgba(0,0,0,0.65) 72%,
          transparent 94%
        );

      mask-image:
        radial-gradient(
          ellipse at center,
          black 42%,
          rgba(0,0,0,0.95) 58%,
          rgba(0,0,0,0.65) 72%,
          transparent 94%
        );

      filter:
        drop-shadow(
          0 0 25px
          rgba(0,0,0,0.65)
        );

      animation:
        ezelVerschijnen
        1.5s
        ease
        forwards;
    }


    #ezel-tekst {

      position: relative;

      top: -6vh;

      font-size:
        clamp(30px, 4.5vw, 54px);

      line-height: 1.4;

      opacity: 0;

      animation:
        afsluitingVerschijnen
        1.5s
        ease
        0.5s
        forwards;
    }


    /* ==========================================
       MAGIE
       ========================================== */

    #magie {

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(180,140,60,0.35),
          rgba(50,35,10,0.25) 35%,
          rgba(0,0,0,0.95) 80%
        );

      z-index: 10;
    }


    #magie.actief {

      animation:
        magisch
        2.5s
        ease-in-out
        forwards;
    }


    /* ==========================================
       ROOK
       ========================================== */

    #rook {

      position: fixed;

      inset: -20%;

      pointer-events: none;

      opacity: 0;

      z-index: 11;

      background:

        radial-gradient(
          ellipse at 30% 50%,
          rgba(170,125,45,0.22),
          transparent 45%
        ),

        radial-gradient(
          ellipse at 70% 40%,
          rgba(210,170,80,0.18),
          transparent 40%
        ),

        radial-gradient(
          ellipse at 50% 80%,
          rgba(120,90,35,0.20),
          transparent 45%
        );

      filter:
        blur(25px);
    }


    #rook.actief {

      animation:
        rook
        2.5s
        ease-in-out
        forwards;
    }


    /* ==========================================
       SLOTGLOED
       ========================================== */

    #slotgloed {

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(210,170,80,0.32),
          rgba(120,85,30,0.20) 40%,

    }


    #slotgloed.actief {

      animation:
        slotgloed
        3.5s
        ease-in-out
        forwards;
    }


    /* ==========================================
       ANIMATIES
       ========================================== */

    @keyframes fotoVerschijnen {

      from {

        opacity: 0;

        transform:
          scale(0.94);
      }

      to {

        opacity: 1;

        transform:
          scale(1);
      }
    }


    @keyframes tekstLater {

      from {

        opacity: 0;

        transform:
          translateX(-50%)
          translateY(20px);
      }

      to {

        opacity: 1;

        transform:
          translateX(-50%)
          translateY(0);
      }
    }


    @keyframes introVerschijnen {

      from {

        opacity: 0;

        transform:
          translateY(20px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    @keyframes afsluitingVerschijnen {

      from {

        opacity: 0;

        transform:
          scale(0.95);
      }

      to {

        opacity: 1;

        transform:
          scale(1);
      }
    }


    @keyframes geheimTekst {

      from {

        opacity: 0;

        transform:
          scale(0.9);
      }

      to {

        opacity: 1;

        transform:
          scale(1);
      }
    }


    @keyframes geheimFlits {

      0% {

        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(0.8);
      }

      15% {

        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1);
      }

      80% {

        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1);
      }

      100% {

        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(1.05);
      }
    }


    @keyframes ezelVerschijnen {

      from {

        opacity: 0;

        transform:
          scale(0.7);
      }

      to {

        opacity: 1;

        transform:
          scale(1);
      }
    }


    @keyframes zachtGloeien {

      0% {

        opacity: 0.65;
      }

      50% {

        opacity: 1;
      }

      100% {

        opacity: 0.65;
      }
    }


    @keyframes magisch {

      0% {

        opacity: 0;

        transform:
          scale(1);
      }

      35% {

        opacity: 1;

        transform:
          scale(1.05);
      }

      70% {

        opacity: 0.7;

        transform:
          scale(1.15);
      }

      100% {

        opacity: 0;

        transform:
          scale(1.3);
      }
    }


    @keyframes slotgloed {

      0% {

        opacity: 0;

        transform:
          scale(1);
      }

      30% {

        opacity: 0.9;

        transform:
          scale(1.03);
      }

      55% {

        opacity: 0.65;

        transform:
          scale(1.08);
      }

      100% {

        opacity: 0;

        transform:
          scale(1.18);
      }
    }


    @keyframes rook {

      0% {

        opacity: 0;

        transform:
          scale(0.8)
          rotate(0deg);
      }

      30% {

        opacity: 1;
      }

      70% {

        opacity: 0.8;

        transform:
          scale(1.1)
          rotate(4deg);
      }

      100% {

        opacity: 0;

        transform:
          scale(1.4)
          rotate(-5deg);
      }
    }

  </style>

</head>

    /*
     * Maakt een nieuwe zak en schudt alle items
     * volledig willekeurig door elkaar.
     *
     * Fisher-Yates shuffle.
     */

    function maakZak(lijst) {

      const zak = [...lijst];

      for (
        let i = zak.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          zak[i],
          zak[j]
        ] = [
          zak[j],
          zak[i]
        ];

      }

      return zak;

    }


    /*
     * Pakt één item uit de zak.
     *
     * Is de zak leeg?
     * Dan wordt de volledige lijst opnieuw
     * gevuld en opnieuw geschud.
     */

    function pakUitZak(lijst, zak) {

      if (zak.length === 0) {

        zak.push(
          ...maakZak(lijst)
        );

      }

      return zak.pop();

    }

      "ezel.png";


    const geheimVoorladen =
      new Image();

    geheimVoorladen.src =
      "geheim.png";


    const oogVoorladen =
      new Image();

    oogVoorladen.src =
      "oog.png";


    /* ==========================================
       BEGIN
       ========================================== */

    function toonBeginScherm() {

      const nederlandsActief =
        taal === "nl"
          ? "actief"
          : "";

      const fransActief =
        taal === "fr"
          ? "actief"
          : "";


      if (taal === "nl") {

        scherm.innerHTML =

          '<div id="titel">' +
            '✨ MAGISCHE SPIEGEL ✨' +
          '</div>' +

          '<div id="ondertitel">' +
            'Sprookjesmagie of Sprookjestragedie' +
          '</div>' +

          '<div id="aanraken">' +
            'RAAK HET SCHERM AAN' +
          '</div>' +

          '<div id="taalkeuze">' +

            '<span class="' +
            nederlandsActief +
            '" data-taal="nl">' +

            '🇳🇱 Nederlands' +

            '</span>' +

            ' | ' +

            '<span class="' +
            fransActief +
            '" data-taal="fr">' +

            '🇫🇷 Français' +

            '</span>' +

          '</div>';

      }

      else {

        scherm.innerHTML =

          '<div id="titel">' +
            '✨ MIROIR MAGIQUE ✨' +
          '</div>' +

          '<div id="ondertitel">' +
            'Magie ou tragédie' +
          '</div>' +

          '<div id="aanraken">' +
            "TOUCHEZ L'ÉCRAN" +
          '</div>' +

          '<div id="taalkeuze">' +

            '<span class="' +
            nederlandsActief +
            '" data-taal="nl">' +

            '🇳🇱 Nederlands' +

            '</span>' +

            ' | ' +

            '<span class="' +
            fransActief +
            '" data-taal="fr">' +

            '🇫🇷 Français' +

            '</span>' +

          '</div>';

      }


      document
        .querySelectorAll(
          "#taalkeuze span"
        )
        .forEach(function(element) {

          element.addEventListener(
            "click",
            function(event) {

              event.stopPropagation();

              taal =
                element.dataset.taal;

              toonBeginScherm();

            }
          );

        });

    }


    /* ==========================================
       INTRO
       ========================================== */

    function toonIntro() {

      const lijst =
        intros[taal];

      const intro =
        pakUitZak(
          lijst,
          introZakken[taal]
        );

      scherm.innerHTML =
        "";

      const tekst =
        document.createElement(
          "div"
        );

      tekst.id =
        "intro";

      tekst.textContent =
        intro;

      scherm.appendChild(
        tekst
      );

      scherm.style.opacity =
        "1";
    }


    /* ==========================================
       GEHEIM
       ========================================== */

    function toonGeheim1() {

      scherm.style.opacity =
        "0";

      setTimeout(function() {

        scherm.innerHTML =
          "";

        const tekst =
          document.createElement(
            "div"
          );

        tekst.id =
          "geheim-tekst";

        tekst.textContent =
          taal === "nl"
            ? "GEHEIM"
            : "SECRET";

        scherm.appendChild(
          tekst
        );

        scherm.style.opacity =
          "1";

        setTimeout(function() {

          scherm.style.opacity =
            "0";

          setTimeout(function() {

            const afbeelding =
              document.createElement(
                "img"
              );

            afbeelding.id =
              "geheim-afbeelding";

            afbeelding.src =
              "geheim.png";

            afbeelding.alt =
              taal === "nl"
                ? "Een prins op een stokpaard"
                : "Un prince sur un cheval à bâton";

            document.body.appendChild(
              afbeelding
            );

            afbeelding.classList.add(
              "flits"
            );

            setTimeout(function() {

              afbeelding.remove();

              scherm.innerHTML =

                '<div id="afsluiting">' +

                (
                  taal === "nl"
                    ? "Oeps... dit stond niet in het sprookjesboek."
                    : "Oups... ce n'était pas dans le livre des contes."
                ) +

                '</div>';

              scherm.style.opacity =
                "1";

              setTimeout(function() {

                scherm.style.opacity =
                  "0";

                setTimeout(
                  toonLaatsteGloed,
                  800
                );

              }, 4000);

            }, 2500);

          }, 700);

        }, 1800);

      }, 800);

    }


    /* ==========================================
       GEHEIM 2
       ========================================== */

    function toonGeheim2() {

      scherm.style.opacity =
        "0";

      setTimeout(function() {

        scherm.innerHTML =
          "";

        const tekst =
          document.createElement(
            "div"
          );

        tekst.id =
          "geheim-tekst";

        tekst.textContent =
          taal === "nl"
            ? "Hij weet meer..."
            : "Il en sait plus...";

        scherm.appendChild(
          tekst
        );

        scherm.style.opacity =
          "1";

        setTimeout(function() {

          scherm.style.opacity =
            "0";

          setTimeout(function() {

            scherm.innerHTML =

              '<div id="afsluiting">' +

              (

                taal === "nl"

                  ? "De spiegel heeft je outfit eens goed bekeken...<br><br>Je kunt die kans op de prijs wel vergeten."

                  : "Le miroir a bien examiné ta tenue...<br><br>Tu peux oublier tes chances de gagner le prix."

              ) +

              '</div>';

            scherm.style.opacity =
              "1";

            setTimeout(function() {

              scherm.style.opacity =
                "0";

              setTimeout(
                toonLaatsteGloed,
                800
              );

            }, 6000);

          }, 700);

        }, 2500);

      }, 800);

    }


    /* ==========================================
       EZEL
       ========================================== */

    function toonEzel() {

      scherm.style.opacity =
        "0";

      setTimeout(function() {

        scherm.innerHTML =
          "";

        const afbeelding =
          document.createElement(
            "img"
          );

        afbeelding.id =
          "ezel-afbeelding";

        afbeelding.src =
          "ezel.png";

        afbeelding.alt =
          taal === "nl"
            ? "Een onverwachte ezel"
            : "Un âne inattendu";

        scherm.appendChild(
          afbeelding
        );

        const tekst =
          document.createElement(
            "div"
          );

        tekst.id =
          "ezel-tekst";

        tekst.textContent =
          taal === "nl"
            ? "O... Dit had de spiegel niet verwacht."
            : "Oh... Le miroir ne s'attendait pas à ça.";

        scherm.appendChild(
          tekst
        );

        scherm.style.opacity =
          "1";

        setTimeout(function() {

          scherm.style.opacity =
            "0";

          setTimeout(
            toonLaatsteGloed,
            800
          );

        }, 6000);

      }, 800);

    }


    /* ==========================================
       OOG
       ========================================== */

    function toonOog() {

      scherm.style.opacity =
        "0";

      setTimeout(function() {

        scherm.innerHTML =
          "";

        const afbeelding =
          document.createElement(
            "img"
          );

        afbeelding.id =
          "geheim-afbeelding";

        afbeelding.src =
          "oog.png";

        afbeelding.alt =
          taal === "nl"
            ? "Een gigantisch oog"
            : "Un œil gigantesque";

        document.body.appendChild(
          afbeelding
        );

        afbeelding.classList.add(
          "flits"
        );

        setTimeout(function() {

          afbeelding.remove();

          toonLaatsteGloed();

        }, 2500);

      }, 500);

    }


    /* ==========================================
       LAATSTE GLOED
       ========================================== */

    function toonLaatsteGloed() {

      slotgloed.classList.remove(
        "actief"
      );

      void slotgloed.offsetWidth;

      slotgloed.classList.add(
        "actief"
      );

      setTimeout(function() {

        taal =
          "nl";

        toonBeginScherm();

        scherm.style.opacity =
          "1";

        bezig =
          false;

      }, 3500);

    }


    /* ==========================================
       AFSLUITING
       ========================================== */

    function toonAfsluiting() {

      const lijst =
        afsluitingen[taal];

      const gekozen =
        pakUitZak(
          lijst,
          afsluitingZakken[taal]
        );

      scherm.style.opacity =
        "0";

      setTimeout(function() {

        scherm.innerHTML =
          "";

        const tekst =
          document.createElement(
            "div"
          );

        tekst.id =
          "afsluiting";

        tekst.textContent =
          gekozen.tekst;

        scherm.appendChild(
          tekst
        );

        scherm.style.opacity =
          "1";

        setTimeout(function() {

          if (
            gekozen.actie ===
            "geheim1"
          ) {

            toonGeheim1();

            return;
          }


          if (
            gekozen.actie ===
            "geheim2"
          ) {

            toonGeheim2();

            return;
          }


          if (
            gekozen.actie ===
            "ezel"
          ) {

            toonEzel();

            return;
          }


          if (
            gekozen.actie ===
            "oog"
          ) {

            toonOog();

            return;
          }


          scherm.style.opacity =
            "0";

          setTimeout(
            toonLaatsteGloed,
            800
          );

        }, 8000);

      }, 800);

    }


    /* ==========================================
       AANRAKEN
       ========================================== */

    scherm.addEventListener(
      "click",
      function() {

        if (bezig) {

          return;
        }

        bezig =
          true;

        toonIntro();

        setTimeout(function() {

          magie.classList.remove(
            "actief"
          );

          rook.classList.remove(
            "actief"
          );

          void magie.offsetWidth;

          void rook.offsetWidth;

          magie.classList.add(
            "actief"
          );

          rook.classList.add(
            "actief"
          );

          scherm.style.opacity =
            "0";

          setTimeout(function() {

            /*
             * De rol wordt niet meer volledig
             * willekeurig gekozen.
             *
             * Eerst komen alle 8 rollen één keer
             * aan bod. Daarna wordt opnieuw geschud.
             */

            const willekeurig =
              pakUitZak(
                acties,
                rolZak
              );

            const taalData =
              willekeurig[taal];

            scherm.innerHTML =
              "";

            const fotoLaag =
              document.createElement(
                "div"
              );

            fotoLaag.id =
              "rol-foto-laag";

            const afbeelding =
              document.createElement(
                "img"
              );

            afbeelding.id =
              "rol-foto";

            afbeelding.src =
              willekeurig.afbeelding;

            afbeelding.alt =
              taalData.naam;

            fotoLaag.appendChild(
              afbeelding
            );

            document.body.appendChild(
              fotoLaag
            );


            setTimeout(function() {

              const rolTekst =
                document.createElement(
                  "div"
                );

              rolTekst.id =
                "rol-tekst";

              const uitkomst =
                document.createElement(
                  "div"
                );

              uitkomst.id =
                "uitkomst";

              uitkomst.textContent =
                taalData.naam;

              rolTekst.appendChild(
                uitkomst
              );


              const beschrijving =
                document.createElement(
                  "div"
                );

              beschrijving.id =
                "beschrijving";

              beschrijving.textContent =
                taalData.tekst;

              rolTekst.appendChild(
                beschrijving
              );

              document.body.appendChild(
                rolTekst
              );

            }, 2000);


            setTimeout(function() {

              const foto =
                document.getElementById(
                  "rol-foto-laag"
                );

              const tekst =
                document.getElementById(
                  "rol-tekst"
                );

              if (foto) {

                foto.remove();
              }

              if (tekst) {

                tekst.remove();
              }

              toonAfsluiting();

            }, 11000);

          }, 1700);

        }, 8000);

      }
    );


    /* ==========================================
       START
       ========================================== */

    toonBeginScherm();


    /* ==========================================
       SERVICE WORKER
       ========================================== */

    if (
      "serviceWorker" in navigator
    ) {

      navigator.serviceWorker.register(
        "service-worker.js"
      );

    }


  </script>

</body>

</html>
