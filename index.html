<!DOCTYPE html>

<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magische Spiegel - Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }

    #scherm {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8vw;
      padding: 20px;
      box-sizing: border-box;
    }
  </style>

</head>

<body>
  <div id="scherm">TIK OP HET SCHERM</div>

  <script>
    const acties = [
      "🎈 ROOD",
      "⭐ BLAUW",
      "🌙 GROEN"
    ];

    const scherm = document.getElementById("scherm");

    scherm.addEventListener("click", function () {
      const willekeurig =
        acties[Math.floor(Math.random() * acties.length)];

      scherm.textContent = willekeurig;
    });

    // Service Worker inschakelen voor offline gebruik
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

</body>
</html>
