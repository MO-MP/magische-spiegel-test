      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, serif;
    }

      color: white;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }

    #spiegel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background-image: url("spiegel.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #spiegel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.30);
      pointer-events: none;
      z-index: 1;
    }

    #scherm {
      position: relative;
      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 18px;
      padding: 40px;
      box-sizing: border-box;

      transition: opacity 0.8s ease;
      cursor: pointer;
    }

    /* ==========================================
       BEGIN
       ========================================== */

    #titel {
      font-size: clamp(38px, 6vw, 70px);
      font-weight: normal;
      white-space: nowrap;
    }

    #ondertitel {
      font-size: clamp(20px, 3vw, 38px);
      font-weight: normal;
    }

    #aanraken {
      font-size: clamp(25px, 4vw, 48px);
      font-weight: normal;

      animation: zachtGloeien 2.5s ease-in-out infinite;
    }

    #taalkeuze {
      font-size: clamp(15px, 2vw, 24px);
      opacity: 0.75;
      margin-top: 5px;
      cursor: pointer;
    }

    #taalkeuze span {
      padding: 5px 10px;
      display: inline-block;
    }

    #taalkeuze .actief {
      opacity: 1;
      text-decoration: underline;
    }

    /* ==========================================
       INTRO
       ========================================== */

    #intro {
      font-size: clamp(25px, 4vw, 48px);
      line-height: 1.5;

      max-width: 80vw;
      padding: 0 30px;
      box-sizing: border-box;

      opacity: 0;

      animation: introVerschijnen 2s ease forwards;
    }

    /* ==========================================
       ROLAFBEELDING
       ========================================== */

    #rol-afbeelding {
      display: block;

      width: auto;
      height: auto;

      max-width: 60vw;
      max-height: 32vh;

      object-fit: contain;

      margin: 0 auto;

      opacity: 0;

      animation: afbeeldingverschijnen 1.8s ease forwards;
    }

    /* ==========================================
       ROLNAAM
       ========================================== */

    #uitkomst {
      font-size: clamp(34px, 5vw, 52px);
      font-weight: normal;

      max-width: 85vw;
      padding: 5px 15px;
      box-sizing: border-box;

      animation: verschijnen 1.8s ease forwards;
    }

    /* ==========================================
       BESCHRIJVING
       ========================================== */

    #beschrijving {
      font-size: clamp(18px, 2.3vw, 26px);

      max-width: 65vw;

      line-height: 1.3;

      padding: 0 10px;
      box-sizing: border-box;

      opacity: 0;

      animation: beschrijving 1.8s ease 0.4s forwards;
    }

    /* ==========================================
       AFSLUITING
       ========================================== */

    #afsluiting {
      font-size: clamp(25px, 4vw, 48px);

      line-height: 1.5;

      max-width: 80vw;

      padding: 0 30px;
      box-sizing: border-box;

      opacity: 0;

    }

    /* ==========================================
       GEHEIM
       ========================================== */

      animation: geheimTekst 1.5s ease forwards;

    /* ==========================================
       GEHEIME / SCHRIK-AFBEELDING
       ========================================== */

    #geheim-afbeelding {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      max-width: 85vw;
      max-height: 80vh;

      object-fit: contain;

      z-index: 20;

      opacity: 0;
    }

      animation: geheimFlits 0.7s ease forwards;
    }

    /* ==========================================
       EZEL
       ========================================== */

    #ezel-afbeelding {
      display: block;

      width: auto;
      height: auto;

      max-width: 75vw;
      max-height: 55vh;

          rgba(210, 170, 80, 0.18),
          transparent 40%
        ),

        radial-gradient(
          ellipse at 50% 80%,
          rgba(120, 90, 35, 0.20),
          transparent 45%

       ========================================== */

      inset: 0;

      opacity: 0;

    }

    #slotgloed.actief {
      animation: slotgloed 3.5s ease-in-out forwards;
    }

    @keyframes introVerschijnen {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes afbeeldingverschijnen {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes verschijnen {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes beschrijving {

        transform: translateY(0);
      }
    }

    @keyframes afsluitingVerschijnen {

        opacity: 0;
        transform: scale(0.95);
      }

        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes geheimTekst {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes geheimFlits {
      0% {
        opacity: 0;

        transform:

      }

      20% {
        opacity: 1;

        transform:
          translate(-50%, -50%)

      }

      75% {

      }

      100% {

        transform:

    }

      }

    @keyframes magisch {

      }

          scale(1.4)

      }
    }

  </style>
</head>

        const tekst =
          document.createElement("div");


        tekst.id =
          "ezel-tekst";


        tekst.textContent =
          taal === "nl"
            ? "O... Dit had de spiegel niet verwacht."
            : "Oh... Le miroir ne s'attendait pas à ça.";


        scherm.appendChild(
          tekst
        );


        scherm.style.opacity =
          "1";


        setTimeout(function() {

          scherm.style.opacity =
            "0";


          setTimeout(function() {

            toonLaatsteGloed();

          }, 800);

        }, 5000);


      }, 800);

    }


    /* ==========================================
       OOG
       ========================================== */

    function toonOog() {

      scherm.style.opacity =
        "0";


      setTimeout(function() {

        scherm.innerHTML =
          "";


        const afbeelding =
          document.createElement("img");


        afbeelding.id =
          "geheim-afbeelding";


        afbeelding.src =
          "oog.png";


        afbeelding.alt =
          taal === "nl"
            ? "Een gigantisch oog"
            : "Un œil gigantesque";


        document.body.appendChild(
          afbeelding
        );


        afbeelding.classList.add(
          "flits"
        );


        setTimeout(function() {

          afbeelding.remove();

          toonLaatsteGloed();

        }, 800);


      }, 500);

    }


    /* ==========================================
       LAATSTE GOUDEN GLOED
       ========================================== */

    function toonLaatsteGloed() {

      slotgloed.classList.remove(
        "actief"
      );


      void slotgloed.offsetWidth;


      slotgloed.classList.add(
        "actief"
      );


      setTimeout(function() {

        /*
         * Iedere nieuwe ronde begint
         * standaard weer in het Nederlands.
         */

        taal = "nl";


        toonBeginScherm();


        scherm.style.opacity =
          "1";


        bezig =
          false;

      }, 3500);

    }


    /* ==========================================
       AFSLUITING
       ========================================== */

    function toonAfsluiting() {

      const lijst =
        afsluitingen[taal];


      const gekozen =
        lijst[
          Math.floor(
            Math.random() *
            lijst.length
          )
        ];


      scherm.style.opacity =
        "0";


      setTimeout(function() {

        scherm.innerHTML = "";


        const tekst =
          document.createElement("div");


        tekst.id =
          "afsluiting";


        tekst.textContent =
          gekozen.tekst;


        scherm.appendChild(
          tekst
        );


        scherm.style.opacity =
          "1";


        /*
         * De afsluiting blijft 8 seconden staan.
         */

        setTimeout(function() {

          if (
            gekozen.actie ===
            "geheim1"
          ) {

            toonGeheim1();

            return;
          }


          if (
            gekozen.actie ===
            "geheim2"
          ) {

            toonGeheim2();

            return;
          }


          if (
            gekozen.actie ===
            "ezel"
          ) {

            toonEzel();

            return;
          }


          if (
            gekozen.actie ===
            "oog"
          ) {

            toonOog();

            return;
          }


          scherm.style.opacity =
            "0";


          setTimeout(
            toonLaatsteGloed,
            800
          );


        }, 8000);


      }, 800);

    }


    /* ==========================================
       AANRAKEN

    scherm.addEventListener(
      "click",
      function() {

        if (bezig) {

        }


        bezig =

        toonIntro();

        setTimeout(function() {

          );

          );

                )
              ];

            ) {

              );

             */

            const uitkomst =

            );

             */

            const beschrijving =

            );

             * De rol blijft 8 seconden zichtbaar.
             */

            setTimeout(
              toonAfsluiting,
              8000
            );


          }, 1700);


        }, 8000);

      }
    );


    /* ==========================================
       START
       ========================================== */

    toonBeginScherm();
