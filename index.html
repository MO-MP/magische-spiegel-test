```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Magische Spiegel</title>

  <style>

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    body {
      background: black;
      color: white;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }


    /* ==========================================
       DE SPIEGEL
       ========================================== */

    #spiegel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background-image: url("spiegel.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    /* Donkere laag */

    #spiegel::before {
      content: "";
      position: absolute;
      inset: 0;

      background: rgba(0, 0, 0, 0.30);

      pointer-events: none;
      z-index: 1;
    }


    /* ==========================================
       SCHERM
       ========================================== */

    #scherm {
      position: relative;
      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 28px;

      padding: 60px;

      box-sizing: border-box;

      transition: opacity 0.8s ease;

      cursor: pointer;
    }


    /* ==========================================
       BEGIN
       ========================================== */

    #titel {
      font-size: clamp(38px, 6vw, 70px);
      font-weight: normal;
      white-space: nowrap;
    }


    #ondertitel {
      font-size: clamp(20px, 3vw, 38px);
      font-weight: normal;
    }


    #aanraken {
      font-size: clamp(25px, 4vw, 48px);
      font-weight: normal;

      animation:
        zachtGloeien
        2.5s
        ease-in-out
        infinite;
    }


    /* ==========================================
       INTRO
       ========================================== */

    #intro {
      font-size: clamp(25px, 4vw, 48px);

      line-height: 1.5;

      max-width: 900px;

      padding: 0 30px;

      box-sizing: border-box;

      opacity: 0;

      animation:
        introVerschijnen
        2s
        ease
        forwards;
    }


    /* ==========================================
       ROL-AFBEELDING
       ========================================== */

    #rol-afbeelding {

      display: block;

      width: auto;
      height: auto;

      max-width: 70vw;
      max-height: 45vh;

      object-fit: contain;

      margin: 0 auto 5px auto;

      opacity: 0;

      animation:
        afbeeldingverschijnen
        1.8s
        ease
        forwards;
    }


    /* ==========================================
       ROLNAAM
       ========================================== */

    #uitkomst {

      font-size:
        clamp(38px, 6vw, 70px);

      font-weight: normal;

      max-width: 100%;

      padding: 10px 20px;

      box-sizing: border-box;

      animation:
        verschijnen
        1.8s
        ease
        forwards;
    }


    /* ==========================================
       BESCHRIJVING
       ========================================== */

    #beschrijving {

      font-size:
        clamp(20px, 3vw, 36px);

      max-width: 850px;

      line-height: 1.4;

      padding: 0 20px;

      box-sizing: border-box;

      opacity: 0;

      animation:
        beschrijving
        1.8s
        ease
        0.4s
        forwards;
    }


    /* ==========================================
       AFSLUITING
       ========================================== */

    #afsluiting {

      font-size:
        clamp(25px, 4vw, 48px);

      line-height: 1.5;

      max-width: 900px;

      padding: 0 30px;

      box-sizing: border-box;

      opacity: 0;

      animation:
        afsluitingVerschijnen
        2.5s
        ease
        forwards;
    }


    /* ==========================================
       GEHEIME EZEL-ACTIE
       ========================================== */

    #ezel-afbeelding {

      display: block;

      width: auto;
      height: auto;

      max-width: 75vw;
      max-height: 55vh;

      object-fit: contain;

      margin: 0 auto 10px auto;

      opacity: 0;

      animation:
        ezelVerschijnen
        1.5s
        ease
        forwards;
    }


    #ezel-tekst {

      font-size:
        clamp(25px, 4vw, 48px);

      line-height: 1.4;

      opacity: 0;

      animation:
        afsluitingVerschijnen
        1.5s
        ease
        0.5s
        forwards;
    }


    /* ==========================================
       GOUDEN MAGIE
       ========================================== */

    #magie {

      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(180, 140, 60, 0.35),
          rgba(50, 35, 10, 0.25) 35%,
          rgba(0, 0, 0, 0.95) 80%
        );

      z-index: 10;
    }


    #magie.actief {

      animation:
        magisch
        2.5s
        ease-in-out
        forwards;
    }


    /* ==========================================
       LAATSTE GOUDEN GLOED
       ========================================== */

    #slotgloed {

      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(210, 170, 80, 0.32),
          rgba(120, 85, 30, 0.20) 40%,
          rgba(0, 0, 0, 0.90) 85%
        );

      z-index: 12;
    }


    #slotgloed.actief {

      animation:
        slotgloed
        3.5s
        ease-in-out
        forwards;
    }


    /* ==========================================
       GOUDEN ROOK
       ========================================== */

    #rook {

      position: fixed;

      inset: -20%;

      pointer-events: none;

      opacity: 0;

      z-index: 11;

      background:

        radial-gradient(
          ellipse at 30% 50%,
          rgba(170, 125, 45, 0.22),
          transparent 45%
        ),

        radial-gradient(
          ellipse at 70% 40%,
          rgba(210, 170, 80, 0.18),
          transparent 40%
        ),

        radial-gradient(
          ellipse at 50% 80%,
          rgba(120, 90, 35, 0.20),
          transparent 45%
        );

      filter: blur(25px);
    }


    #rook.actief {

      animation:
        rook
        2.5s
        ease-in-out
        forwards;
    }


    /* ==========================================
       ANIMATIES
       ========================================== */

    @keyframes introVerschijnen {

      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes afbeeldingverschijnen {

      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    @keyframes verschijnen {

      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    @keyframes beschrijving {

      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes afsluitingVerschijnen {

      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    @keyframes ezelVerschijnen {

      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    @keyframes zachtGloeien {

      0% {
        opacity: 0.65;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.65;
      }

    }


    @keyframes magisch {

      0% {
        opacity: 0;
        transform: scale(1);
      }

      35% {
        opacity: 1;
        transform: scale(1.05);
      }

      70% {
        opacity: 0.7;
        transform: scale(1.15);
      }

      100% {
        opacity: 0;
        transform: scale(1.3);
      }

    }


    @keyframes slotgloed {

      0% {
        opacity: 0;
        transform: scale(1);
      }

      30% {
        opacity: 0.9;
        transform: scale(1.03);
      }

      55% {
        opacity: 0.65;
        transform: scale(1.08);
      }

      100% {
        opacity: 0;
        transform: scale(1.18);
      }

    }


    @keyframes rook {

      0% {
        opacity: 0;
        transform:
          scale(0.8)
          rotate(0deg);
      }

      30% {
        opacity: 1;
      }

      70% {
        opacity: 0.8;
        transform:
          scale(1.1)
          rotate(4deg);
      }

      100% {
        opacity: 0;
        transform:
          scale(1.4)
          rotate(-5deg);
      }

    }

  </style>
</head>


<body>


  <div id="spiegel">

    <div id="magie"></div>

    <div id="rook"></div>

    <div id="slotgloed"></div>


    <div id="scherm">

      <div id="titel">
        ✨ MAGISCHE SPIEGEL ✨
      </div>

      <div id="ondertitel">
        Sprookjesmagie of Sprookjestragedie
      </div>

      <div id="aanraken">
        RAAK HET SCHERM AAN
      </div>

    </div>

  </div>


  <script>


    /* ==========================================
       ROLLEN
       ========================================== */

    const acties = [

      {
        naam: "👑 DE KONINKLIJKE",

        tekst:
          "Je hebt iets koninklijks. Of je doet in ieder geval alsof.",

        afbeelding:
          "koninklijke.png"
      },


      {
        naam: "🦹 DE SCHURK",

        tekst:
          "Je bedoelingen zijn uitstekend. Dat maakt het alleen maar verdacht."
      },


      {
        naam: "🎭 HET NOODLOT",

        tekst:
          "Sommige dingen zijn voorbestemd. Dit was er blijkbaar één van."
      },


      {
        naam: "⭐ DE UITVERKORENE",

        tekst:
          "Het lot heeft jou gekozen. Hopelijk weet het lot wat het doet."
      },


      {
        naam: "🧙 DE MAGIËR",

        tekst:
          "Je bezit grote krachten. Vooral als niemand kijkt.",

        afbeelding:
          "magier.png"
      },


      {
        naam: "🧚 DE BETOVERDE",

        tekst:
          "Er hangt magie om je heen. Of misschien is dat gewoon je uitstraling."
      },


      {
        naam: "🌙 DE RUITER UIT DE MIST",

        tekst:
          "Je verschijnt wanneer niemand je verwacht... zelfs jij niet.",

        afbeelding:
          "ruiter-uit-de-mist.png"
      },


      {
        naam: "🐴 DE VROLIJKE RUITER",

        tekst:
          "Je komt te paard. Waarom? Dat weet niemand."
      }

    ];


    /* ==========================================
       INTRO'S
       ========================================== */

    const intros = [

      "Een zachte mist trekt over het glas... Ergens tussen sprookjesmagie en sprookjestragedie wacht jouw verhaal.",

      "De spiegel kijkt terug... Maar wat ziet hij eigenlijk in jou?",

      "Stil nu... de oude magie wordt wakker.",

      "Niet iedereen die in de spiegel kijkt, krijgt hetzelfde verhaal te zien...",

      "Het sprookje begint. Maar jij bepaalt nog niet hoe het eindigt."

    ];


    /* ==========================================
       AFSLUITINGEN
       ========================================== */

    const afsluitingen = [

      {
        tekst:
          "De spiegel heeft gesproken... maar sommige geheimen blijven verborgen."
      },

      {
        tekst:
          "De magie verdwijnt... maar de spiegel is nog niet uitgesproken."
      },

      {
        tekst:
          "Was dit werkelijk jouw lot? Misschien moet je nog eens kijken...",

        geheimeActie:
          true
      },

      {
        tekst:
          "De spiegel zwijgt weer... maar hij heeft jou gezien."
      },

      {
        tekst:
          "Een verhaal eindigt hier... of begint het pas?"
      },

      {
        tekst:
          "De mist trekt op... maar niet alle geheimen zijn verdwenen."
      }

    ];


    /* ==========================================
       ELEMENTEN
       ========================================== */

    const scherm =
      document.getElementById("scherm");

    const magie =
      document.getElementById("magie");

    const rook =
      document.getElementById("rook");

    const slotgloed =
      document.getElementById("slotgloed");


    /*
     * Voorkomt meerdere aanrakingen
     * tijdens één beurt.
     */

    let bezig =
      false;


    /* ==========================================
       AFBEELDINGEN VOORAF LADEN
       ========================================== */

    acties.forEach(function(actie) {

      if (actie.afbeelding) {

        const img =
          new Image();

        img.src =
          actie.afbeelding;

      }

    });


    /*
     * Ook de geheime ezelafbeelding
     * alvast laden.
     */

    const ezelVoorladen =
      new Image();

    ezelVoorladen.src =
      "ezel.png";


    /* ==========================================
       BEGIN SCHERM
       ========================================== */

    function toonBeginScherm() {

      scherm.innerHTML =

        '<div id="titel">' +
          '✨ MAGISCHE SPIEGEL ✨' +
        '</div>' +

        '<div id="ondertitel">' +
          'Sprookjesmagie of Sprookjestragedie' +
        '</div>' +

        '<div id="aanraken">' +
          'RAAK HET SCHERM AAN' +
        '</div>';

    }


    /* ==========================================
       INTRO
       ========================================== */

    function toonIntro() {

      const intro =
        intros[
          Math.floor(
            Math.random() *
            intros.length
          )
        ];


      scherm.innerHTML = "";


      const tekst =
        document.createElement("div");


      tekst.id =
        "intro";


      tekst.textContent =
        intro;


      scherm.appendChild(
        tekst
      );


      scherm.style.opacity =
        "1";

    }


    /* ==========================================
       GEHEIME EZEL-ACTIE
       ========================================== */

    function toonEzelActie() {

      scherm.style.opacity =
        "0";


      setTimeout(function() {

        scherm.innerHTML = "";


        const afbeelding =
          document.createElement("img");


        afbeelding.id =
          "ezel-afbeelding";


        afbeelding.src =
          "ezel.png";


        afbeelding.alt =
          "Een ridder op een ezel";


        scherm.appendChild(
          afbeelding
        );


        const tekst =
          document.createElement("div");


        tekst.id =
          "ezel-tekst";


        tekst.textContent =
          "O... Dit had de spiegel niet verwacht.";


        scherm.appendChild(
          tekst
        );


        scherm.style.opacity =
          "1";


        /*
         * De absurde afbeelding blijft
         * ongeveer 5 seconden zichtbaar.
         */

        setTimeout(function() {

          scherm.style.opacity =
            "0";


          setTimeout(function() {

            toonLaatsteGloed();

          }, 800);


        }, 5000);


      }, 800);

    }


    /* ==========================================
       LAATSTE GOUDEN GLOED
       ========================================== */

    function toonLaatsteGloed() {

      slotgloed.classList.remove(
        "actief"
      );


      void slotgloed.offsetWidth;


      slotgloed.classList.add(
        "actief"
      );


      /*
       * Na 3,5 seconden is de gloed
       * voorbij en komt het begin terug.
       */

      setTimeout(function() {

        toonBeginScherm();

        scherm.style.opacity =
          "1";

        bezig =
          false;

      }, 3500);

    }


    /* ==========================================
       AFSLUITING
       ========================================== */

    function toonAfsluiting() {

      const gekozen =
        afsluitingen[
          Math.floor(
            Math.random() *
            afsluitingen.length
          )
        ];


      scherm.style.opacity =
        "0";


      setTimeout(function() {

        scherm.innerHTML = "";


        const tekst =
          document.createElement("div");


        tekst.id =
          "afsluiting";


        tekst.textContent =
          gekozen.tekst;


        scherm.appendChild(
          tekst
        );


        scherm.style.opacity =
          "1";


        /*
         * Afsluiting blijft 7 seconden staan.
         */

        setTimeout(function() {


          /*
           * Als dit een speciale
           * afsluiting is, komt de
           * geheime ezelactie.
           */

          if (gekozen.geheimeActie) {

            toonEzelActie();

            return;

          }


          /*
           * Normale afsluiting:
           * tekst verdwijnt.
           */

          scherm.style.opacity =
            "0";


          setTimeout(function() {

            toonLaatsteGloed();

          }, 800);


        }, 7000);


      }, 800);

    }


    /* ==========================================
       SPIEGEL AANRAKEN
       ========================================== */

    scherm.addEventListener(
      "click",
      function() {


        /*
         * Tijdens een beurt
         * niets opnieuw starten.
         */

        if (bezig) {
          return;
        }


        bezig =
          true;


        /*
         * Intro tonen.
         */

        toonIntro();


        /*
         * INTRO BLIJFT 6 SECONDEN STAAN.
         */

        setTimeout(function() {


          /*
           * Gouden magie opnieuw starten.
           */

          magie.classList.remove(
            "actief"
          );

          rook.classList.remove(
            "actief"
          );


          void magie.offsetWidth;
          void rook.offsetWidth;


          magie.classList.add(
            "actief"
          );

          rook.classList.add(
            "actief"
          );


          /*
           * Intro laten verdwijnen.
           */

          scherm.style.opacity =
            "0";


          /*
           * Na de gouden magie
           * de rol tonen.
           */

          setTimeout(function() {


            const willekeurig =
              acties[
                Math.floor(
                  Math.random() *
                  acties.length
                )
              ];


            scherm.innerHTML =
              "";


            /*
             * Afbeelding.
             */

            if (willekeurig.afbeelding) {

              const afbeelding =
                document.createElement("img");


              afbeelding.id =
                "rol-afbeelding";


              afbeelding.src =
                willekeurig.afbeelding;


              afbeelding.alt =
                willekeurig.naam;


              scherm.appendChild(
                afbeelding
              );

            }


            /*
             * Rolnaam.
             */

            const uitkomst =
              document.createElement("div");


            uitkomst.id =
              "uitkomst";


            uitkomst.textContent =
              willekeurig.naam;


            scherm.appendChild(
              uitkomst
            );


            /*
             * Beschrijving.
             */

            const beschrijving =
              document.createElement("div");


            beschrijving.id =
              "beschrijving";


            beschrijving.textContent =
              willekeurig.tekst;


            scherm.appendChild(
              beschrijving
            );


            scherm.style.opacity =
              "1";


            /*
             * ROL BLIJFT 12 SECONDEN STAAN.
             */

            setTimeout(
              toonAfsluiting,
              12000
            );


          }, 1700);


        }, 6000);


      }
    );


    /* ==========================================
       SERVICE WORKER
       ========================================== */

    if ("serviceWorker" in navigator) {

      navigator.serviceWorker.register(
        "service-worker.js"
      );

    }

  </script>

</body>
</html>
