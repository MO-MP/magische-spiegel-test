<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Magische Spiegel</title>

  <style>

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    body {
      background: black;
      color: white;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }


    /* ==========================================
       DE SPIEGEL
       ========================================== */

    #spiegel {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background-image: url("spiegel.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    /* Donkere laag over de spiegel */

    #spiegel::before {
      content: "";

      position: absolute;
      inset: 0;

      background: rgba(0, 0, 0, 0.30);

      pointer-events: none;

      z-index: 1;
    }


    /* ==========================================
       SCHERM
       ========================================== */

    #scherm {
      position: relative;

      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 28px;

      padding: 60px;

      box-sizing: border-box;

      transition: opacity 0.5s ease;

      cursor: pointer;
    }


    /* ==========================================
       BEGINTEKST
       ========================================== */

    #titel {
      font-size: clamp(38px, 6vw, 70px);

      font-weight: normal;

      white-space: nowrap;
    }


    #ondertitel {
      font-size: clamp(20px, 3vw, 38px);

      font-weight: normal;
    }


    #aanraken {
      font-size: clamp(25px, 4vw, 48px);

      font-weight: normal;
    }


    /* ==========================================
       ROL-AFBEELDING
       ========================================== */

    #rol-afbeelding {

      display: block;

      width: auto;
      height: auto;

      max-width: 70vw;
      max-height: 45vh;

      object-fit: contain;

      margin: 0 auto 5px auto;

      opacity: 0;

      animation:
        afbeeldingverschijnen
        1.8s ease
        forwards;
    }


    /* ==========================================
       ROLNAAM
       ========================================== */

    #uitkomst {

      font-size:
        clamp(38px, 6vw, 70px);

      font-weight: normal;

      max-width: 100%;

      padding: 10px 20px;

      box-sizing: border-box;

      animation:
        verschijnen
        1.8s ease
        forwards;
    }


    /* ==========================================
       BESCHRIJVING
       ========================================== */

    #beschrijving {

      font-size:
        clamp(20px, 3vw, 36px);

      max-width: 850px;

      line-height: 1.4;

      padding: 0 20px;

      box-sizing: border-box;

      opacity: 0;

      animation:
        beschrijving
        1.8s ease
        0.4s
        forwards;
    }


    /* ==========================================
       GOUDEN MAGIE
       ========================================== */

    #magie {

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(180, 140, 60, 0.35),
          rgba(50, 35, 10, 0.25) 35%,
          rgba(0, 0, 0, 0.95) 80%
        );

      z-index: 10;
    }


    #magie.actief {
      animation:
        magisch
        2.5s
        ease-in-out
        forwards;
    }


    /* ==========================================
       GOUDEN ROOK
       ========================================== */

    #rook {

      position: fixed;

      inset: -20%;

      pointer-events: none;

      opacity: 0;

      z-index: 11;

      background:

        radial-gradient(
          ellipse at 30% 50%,
          rgba(170, 125, 45, 0.22),
          transparent 45%
        ),

        radial-gradient(
          ellipse at 70% 40%,
          rgba(210, 170, 80, 0.18),
          transparent 40%
        ),

        radial-gradient(
          ellipse at 50% 80%,
          rgba(120, 90, 35, 0.20),
          transparent 45%
        );

      filter: blur(25px);
    }


    #rook.actief {
      animation:
        rook
        2.5s
        ease-in-out
        forwards;
    }


    /* ==========================================
       ANIMATIES
       ========================================== */

    @keyframes afbeeldingverschijnen {

      from {
        opacity: 0;

        transform:
          scale(0.85);
      }

      to {
        opacity: 1;

        transform:
          scale(1);
      }

    }


    @keyframes verschijnen {

      from {
        opacity: 0;

        transform:
          scale(0.85);
      }

      to {
        opacity: 1;

        transform:
          scale(1);
      }

    }


    @keyframes beschrijving {

      from {
        opacity: 0;

        transform:
          translateY(15px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    @keyframes magisch {

      0% {
        opacity: 0;

        transform:
          scale(1);
      }

      35% {
        opacity: 1;

        transform:
          scale(1.05);
      }

      70% {
        opacity: 0.7;

        transform:
          scale(1.15);
      }

      100% {
        opacity: 0;

        transform:
          scale(1.3);
      }

    }


    @keyframes rook {

      0% {
        opacity: 0;

        transform:
          scale(0.8)
          rotate(0deg);
      }

      30% {
        opacity: 1;
      }

      70% {
        opacity: 0.8;

        transform:
          scale(1.1)
          rotate(4deg);
      }

      100% {
        opacity: 0;

        transform:
          scale(1.4)
          rotate(-5deg);
      }

    }

  </style>
</head>


<body>


  <div id="spiegel">


    <!-- Gouden magie -->

    <div id="magie"></div>

    <div id="rook"></div>


    <!-- Scherm -->

    <div id="scherm">

      <div id="titel">
        ✨ MAGISCHE SPIEGEL ✨
      </div>

      <div id="ondertitel">
        Sprookjesmagie of Sprookjestragedie
      </div>

      <div id="aanraken">
        RAAK HET SCHERM AAN
      </div>

    </div>


  </div>


  <script>


    /* ==========================================
       DE ROLLEN
       ========================================== */

    const acties = [

      {
        naam: "👑 DE KONINKLIJKE",

        tekst:
          "Je hebt iets koninklijks. Of je doet in ieder geval alsof.",

        afbeelding:
          "koninklijke.png"
      },


      {
        naam: "🦹 DE SCHURK",

        tekst:
          "Je bedoelingen zijn uitstekend. Dat maakt het alleen maar verdacht."
      },


      {
        naam: "🎭 HET NOODLOT",

        tekst:
          "Sommige dingen zijn voorbestemd. Dit was er blijkbaar één van."
      },


      {
        naam: "⭐ DE UITVERKORENE",

        tekst:
          "Het lot heeft jou gekozen. Hopelijk weet het lot wat het doet."
      },


      {
        naam: "🧙 DE MAGIËR",

        tekst:
          "Je bezit grote krachten. Vooral als niemand kijkt.",

        afbeelding:
          "magier.png"
      },


      {
        naam: "🧚 DE BETOVERDE",

        tekst:
          "Er hangt magie om je heen. Of misschien is dat gewoon je uitstraling."
      },


      {
        naam: "🌙 DE RUITER UIT DE MIST",

        tekst:
          "Je verschijnt wanneer niemand je verwacht... zelfs jij niet.",

        afbeelding:
          "ruiter-uit-de-mist.png"
      },


      {
        naam: "🐴 DE VROLIJKE RUITER",

        tekst:
          "Je komt te paard. Waarom? Dat weet niemand."
      }

    ];


    /* ==========================================
       ELEMENTEN OP HET SCHERM
       ========================================== */

    const scherm =
      document.getElementById("scherm");

    const magie =
      document.getElementById("magie");

    const rook =
      document.getElementById("rook");


    /* ==========================================
       AFBEELDINGEN VOORAF LADEN
       ========================================== */

    acties.forEach(function(actie) {

      if (actie.afbeelding) {

        const img =
          new Image();

        img.src =
          actie.afbeelding;

      }

    });


    /* ==========================================
       SPIEGEL AANRAKEN
       ========================================== */

    scherm.addEventListener(
      "click",
      function() {


        /* Gouden magie */

        magie.classList.add("actief");

        rook.classList.add("actief");


        /* Beginbeeld laten verdwijnen */

        scherm.style.opacity = "0";


        /*
         * Na 1,7 seconde
         * een willekeurige rol tonen.
         */

        setTimeout(function() {


          /* Willekeurige rol */

          const willekeurig =
            acties[
              Math.floor(
                Math.random() *
                acties.length
              )
            ];


          /* Scherm leegmaken */

          scherm.innerHTML = "";


          /* ----------------------------------
             AFBEELDING
             ---------------------------------- */

          if (willekeurig.afbeelding) {


            const afbeelding =
              document.createElement("img");


            afbeelding.id =
              "rol-afbeelding";


            afbeelding.src =
              willekeurig.afbeelding;


            afbeelding.alt =
              willekeurig.naam;


            /*
             * Controle voor het geval
             * een bestand ontbreekt.
             */

            afbeelding.onerror =
              function() {

                console.error(
                  "Afbeelding niet gevonden:",
                  willekeurig.afbeelding
                );

              };


            scherm.appendChild(
              afbeelding
            );

          }


          /* ----------------------------------
             NAAM
             ---------------------------------- */

          const uitkomst =
            document.createElement("div");


          uitkomst.id =
            "uitkomst";


          uitkomst.textContent =
            willekeurig.naam;


          scherm.appendChild(
            uitkomst
          );


          /* ----------------------------------
             BESCHRIJVING
             ---------------------------------- */

          const beschrijving =
            document.createElement("div");


          beschrijving.id =
            "beschrijving";


          beschrijving.textContent =
            willekeurig.tekst;


          scherm.appendChild(
            beschrijving
          );


          /* Resultaat tonen */

          scherm.style.opacity =
            "1";


        }, 1700);

      }

    );


    /* ==========================================
       SERVICE WORKER
       ========================================== */

    if ("serviceWorker" in navigator) {

      navigator.serviceWorker.register(
        "service-worker.js"
      );

    }


  </script>


</body>
</html>
