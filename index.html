<!DOCTYPE html>

<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Magische Spiegel</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }

    #spiegel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background-image: url("spiegel.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #spiegel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.30);
      pointer-events: none;
      z-index: 1;
    }

    #scherm {
      position: relative;
      z-index: 5;

      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 60px;
      box-sizing: border-box;

      transition: opacity 0.8s ease;
    }

    #titel {
      font-size: clamp(38px, 6vw, 70px);
      font-weight: normal;
      white-space: nowrap;
    }

    #ondertitel {
      font-size: clamp(20px, 3vw, 38px);
      font-weight: normal;
    }

    #aanraken {
      font-size: clamp(25px, 4vw, 48px);
      font-weight: normal;
    }

    #intro {
      font-size: clamp(25px, 4vw, 48px);
      line-height: 1.4;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
      animation: verschijnen 1.2s ease forwards;
    }

    #uitkomst {
      font-size: clamp(38px, 6vw, 70px);
      font-weight: normal;
      max-width: 100%;
      padding: 20px;
      box-sizing: border-box;
      animation: verschijnen 1.2s ease forwards;
    }

    #beschrijving {
      font-size: clamp(20px, 3vw, 36px);
      max-width: 850px;
      line-height: 1.4;
      padding: 0 20px;
      box-sizing: border-box;
      opacity: 0;
      animation: beschrijving 1.2s ease 0.4s forwards;
    }

    /* Afbeelding van een rol */
    #rolAfbeelding {
      max-width: 70vw;
      max-height: 45vh;
      object-fit: contain;
      border-radius: 8px;
      animation: afbeeldingVerschijnt 1.2s ease forwards;
    }

    /* Tijdelijke plek wanneer een afbeelding nog ontbreekt */
    #afbeeldingFallback {
      display: none;
      font-size: clamp(24px, 4vw, 48px);
      padding: 30px;
      opacity: 0.8;
    }

    /* Gouden magie */
    #magie {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(180, 140, 60, 0.35),
          rgba(50, 35, 10, 0.25) 35%,
          rgba(0, 0, 0, 0.95) 80%
        );

      z-index: 10;
    }

    #magie.actief {
      animation: magisch 2.5s ease-in-out forwards;
    }

    /* Gouden rook */
    #rook {
      position: fixed;
      inset: -20%;
      pointer-events: none;
      opacity: 0;
      z-index: 11;

      background:
        radial-gradient(
          ellipse at 30% 50%,
          rgba(170, 125, 45, 0.22),
          transparent 45%
        ),
        radial-gradient(
          ellipse at 70% 40%,
          rgba(210, 170, 80, 0.18),
          transparent 40%
        ),
        radial-gradient(
          ellipse at 50% 80%,
          rgba(120, 90, 35, 0.20),
          transparent 45%
        );

      filter: blur(25px);
    }

    #rook.actief {
      animation: rook 2.5s ease-in-out forwards;
    }

    /* Afbeelding voor afsluitende verrassingen */
    #afsluitingAfbeelding {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 20;
      pointer-events: none;
    }

    #afsluitingAfbeelding.flik {
      display: block;
      animation: flits 0.8s ease forwards;
    }

    @keyframes verschijnen {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes beschrijving {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes afbeeldingVerschijnt {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes magisch {
      0% {
        opacity: 0;
        transform: scale(1);
      }

      35% {
        opacity: 1;
        transform: scale(1.05);
      }

      70% {
        opacity: 0.7;
        transform: scale(1.15);
      }

      100% {
        opacity: 0;
        transform: scale(1.3);
      }
    }

    @keyframes rook {
      0% {
        opacity: 0;
        transform: scale(0.8) rotate(0deg);
      }

      30% {
        opacity: 1;
      }

      70% {
        opacity: 0.8;
        transform: scale(1.1) rotate(4deg);
      }

      100% {
        opacity: 0;
        transform: scale(1.4) rotate(-5deg);
      }
    }

    @keyframes flits {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }

      15% {
        opacity: 1;
        transform: scale(1);
      }

      70% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.05);
      }
    }
  </style>

</head>

<body>

  <div id="spiegel">

```
<div id="magie"></div>
<div id="rook"></div>

<img id="afsluitingAfbeelding" src="" alt="">

<div id="scherm">

  <div id="titel">✨ MAGISCHE SPIEGEL ✨</div>

  <div id="ondertitel">
    Sprookjesmagie of Sprookjestragedie
  </div>

  <div id="aanraken">
    RAAK HET SCHERM AAN
  </div>

</div>
```

  </div>

  <script>

    /* =========================
       INTRO'S
    ========================= */

    const intros = [
      "Een zachte mist trekt over het glas... Ergens tussen sprookjesmagie en sprookjestragedie wacht jouw verhaal.",

      "De spiegel kijkt terug... Maar wat ziet hij eigenlijk in jou?",

      "Stil nu... de oude magie wordt wakker.",

      "Niet iedereen die in de spiegel kijkt, krijgt hetzelfde verhaal te zien...",

      "Iedereen heeft twee kanten... Welke zal de spiegel vandaag in jou ontdekken?"
    ];


    /* =========================
       ROLLEN
    ========================= */

    const acties = [

      {
        naam: "👑 DE KONINKLIJKE",
        tekst: "Je hebt iets koninklijks. Of je doet in ieder geval alsof.",
        afbeelding: "koninklijke.png"
      },

      {
        naam: "🦹 DE SCHURK",
        tekst: "Je bedoelingen zijn uitstekend. Dat maakt het alleen maar verdacht.",
        afbeelding: "schurk.png"
      },

      {
        naam: "🎭 HET NOODLOT",
        tekst: "Sommige dingen zijn voorbestemd. Dit was er blijkbaar één van.",
        afbeelding: "noodlot.png"
      },

      {
        naam: "⭐ DE UITVERKORENE",
        tekst: "Het lot heeft jou gekozen. Hopelijk weet het lot wat het doet.",
        afbeelding: "uitverkorene.png"
      },

      {
        naam: "🧙 DE MAGIËR",
        tekst: "Je bezit grote krachten. Vooral als niemand kijkt.",
        afbeelding: "magier.png"
      },

      {
        naam: "🧚 DE BETOVERDE",
        tekst: "Er hangt magie om je heen. Of misschien is dat gewoon je uitstraling.",
        afbeelding: "betoverde.png"
      },

      {
        naam: "🌙 DE RUITER UIT DE MIST",
        tekst: "Je verschijnt wanneer niemand je verwacht... zelfs jij niet.",
        afbeelding: "ruiter-uit-de-mist.png"
      },

      {
        naam: "🐴 DE VROLIJKE RUITER",
        tekst: "Je komt te paard. Waarom? Dat weet niemand.",
        afbeelding: "vrolijke-ruiter.png"
      }

    ];


    /* =========================
       AFSLUITINGEN
    ========================= */

    const afsluitingen = [

      {
        tekst: "De spiegel heeft gesproken... maar sommige geheimen blijven verborgen.",
        actie: "geheim"
      },

      {
        tekst: "De spiegel heeft je outfit eens goed bekeken... Je kunt die kans op de prijs wel vergeten.",
        actie: "geen"
      },

      {
        tekst: "Was dit werkelijk jouw lot? Misschien moet je nog eens kijken...",
        actie: "ezel"
      },

      {
        tekst: "De spiegel zwijgt weer... maar hij heeft jou gezien.",
        actie: "oog"
      },

      {
        tekst: "Een verhaal eindigt hier... of begint het pas?",
        actie: "geen"
      }

    ];


    /* =========================
       ELEMENTEN
    ========================= */

    const scherm = document.getElementById("scherm");
    const magie = document.getElementById("magie");
    const rook = document.getElementById("rook");
    const afsluitingAfbeelding =
      document.getElementById("afsluitingAfbeelding");


    let bezig = false;


    /* =========================
       STARTSCHERM
    ========================= */

    function startscherm() {

      scherm.innerHTML = `
        <div id="titel">✨ MAGISCHE SPIEGEL ✨</div>

        <div id="ondertitel">
          Sprookjesmagie of Sprookjestragedie
        </div>

        <div id="aanraken">
          RAAK HET SCHERM AAN
        </div>
      `;

      scherm.style.opacity = "1";

      afsluitingAfbeelding.classList.remove("flik");
      afsluitingAfbeelding.style.display = "none";
      afsluitingAfbeelding.src = "";

      bezig = false;
    }


    /* =========================
       HOOFDPROCES
    ========================= */

    scherm.addEventListener("click", function () {

      if (bezig) return;

      bezig = true;

      magie.classList.remove("actief");
      rook.classList.remove("actief");

      /* Willekeurige intro */

      const intro =
        intros[Math.floor(Math.random() * intros.length)];

      scherm.style.opacity = "0";


      setTimeout(function () {

        scherm.innerHTML = `
          <div id="intro">${intro}</div>
        `;

        scherm.style.opacity = "1";


        /*
          INTRO BLIJFT LANGER STAAN
          Daarna begint de gouden magie.
        */

        setTimeout(function () {

          magie.classList.remove("actief");
          rook.classList.remove("actief");

          void magie.offsetWidth;
          void rook.offsetWidth;

          magie.classList.add("actief");
          rook.classList.add("actief");

          scherm.style.opacity = "0";


          /*
            Tijdens de gouden gloed
            wordt de rol gekozen.
          */

          setTimeout(function () {

            const willekeurig =
              acties[Math.floor(Math.random() * acties.length)];


            scherm.innerHTML = `

              <img
                id="rolAfbeelding"
                src="${willekeurig.afbeelding}"
                alt="${willekeurig.naam}"
                onerror="
                  this.style.display='none';
                  document.getElementById('afbeeldingFallback').style.display='block';
                "
              >

              <div id="afbeeldingFallback">
                ${willekeurig.naam}
              </div>

              <div id="uitkomst">
                ${willekeurig.naam}
              </div>

              <div id="beschrijving">
                ${willekeurig.tekst}
              </div>

            `;

            scherm.style.opacity = "1";


            /*
              ROL BLIJFT KORTER STAAN
            */

            setTimeout(function () {

              toonAfsluiting();

            }, 5000);


          }, 1200);

        }, 500);


      }, 800);

    });


    /* =========================
       AFSLUITING
    ========================= */

    function toonAfsluiting() {

      const afsluiting =
        afsluitingen[
          Math.floor(Math.random() * afsluitingen.length)
        ];


      scherm.style.opacity = "0";


      setTimeout(function () {

        scherm.innerHTML = `
          <div id="beschrijving"
               style="opacity:1; animation:none;">
            ${afsluiting.tekst}
          </div>
        `;

        scherm.style.opacity = "1";


        /*
          Afsluiting blijft LANGER staan.
        */

        setTimeout(function () {

          voerAfsluitActieUit(afsluiting.actie);

        }, 6500);


      }, 800);

    }


    /* =========================
       AFSLUITACTIES
    ========================= */

    function voerAfsluitActieUit(actie) {

      if (actie === "geheim") {

        scherm.style.opacity = "0";

        setTimeout(function () {

          scherm.innerHTML = `
            <div id="uitkomst">
              GEHEIM
            </div>
          `;

          scherm.style.opacity = "1";


          setTimeout(function () {

            toonAfbeelding(
              "prins-heks.png",
              "Oeps... dit stond niet in het sprookjesboek."
            );

          }, 1800);

        }, 700);

      }

      else if (actie === "ezel") {

        toonAfbeelding(
          "ezel.png",
          ""
        );

      }

      else if (actie === "oog") {

        toonAfbeelding(
          "oog.png",
          ""
        );

      }

      else {

        goudenAfsluiting();

      }

    }


    /* =========================
       AFBEELDING TONEN
    ========================= */

    function toonAfbeelding(bestand, tekst) {

      afsluitingAfbeelding.src = bestand;
      afsluitingAfbeelding.style.display = "block";

      void afsluitingAfbeelding.offsetWidth;

      afsluitingAfbeelding.classList.add("flik");


      setTimeout(function () {

        afsluitingAfbeelding.classList.remove("flik");
        afsluitingAfbeelding.style.display = "none";


        if (tekst) {

          scherm.style.opacity = "0";

          setTimeout(function () {

            scherm.innerHTML = `
              <div id="beschrijving"
                   style="opacity:1; animation:none;">
                ${tekst}
              </div>
            `;

            scherm.style.opacity = "1";


            setTimeout(function () {

              goudenAfsluiting();

            }, 3500);

          }, 500);

        }

        else {

          goudenAfsluiting();

        }

      }, 800);

    }


    /* =========================
       TERUG NAAR HET BEGIN
    ========================= */

    function goudenAfsluiting() {

      magie.classList.remove("actief");
      rook.classList.remove("actief");

      void magie.offsetWidth;
      void rook.offsetWidth;

      magie.classList.add("actief");
      rook.classList.add("actief");


      setTimeout(function () {

        startscherm();

      }, 2500);

    }


    /* =========================
       SERVICE WORKER
    ========================= */

    if ("serviceWorker" in navigator) {

      navigator.serviceWorker.register("service-worker.js")
        .catch(function (error) {

          console.log(
            "Service Worker kon niet worden geladen:",
            error
          );

        });

    }

  </script>

</body>
</html>
